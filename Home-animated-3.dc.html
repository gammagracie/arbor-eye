<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="assets/fonts/neuzeit.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
html { scroll-behavior: smooth; }
body { margin: 0; background: #FDFDFB; color: #141414; font-family: "Neuzeit Grotesk", "Helvetica Neue", Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #141414; text-decoration: none; }
a:hover { color: #6E6B66; }
::selection { background: #E9E6DF; }
p, h1, h2, h3, li { text-wrap: pretty; }
/* Header and footer grow with the viewport from 1280px (72px / 43px) to 1920px (80px / 54px) */
:root { --header-h: clamp(72px, 57px + 1.172vw, 80px); --footer-h: clamp(43px, 19px + 1.859vw, 54px); }
/* Side padding, shared by header, main and footer on every page: 24px phone, 48px tablet, 10% from 1024px up */
:root { --side-pad: 24px; }
@media (min-width: 768px) { :root { --side-pad: 48px; } }
@media (min-width: 1024px) { :root { --side-pad: 10vw; } }
html { scrollbar-gutter: stable; }
/* TEMP: while H2 / H3 / H4 / G3 / G4 are in the nav, tighten it at tablet widths so the header stays on one line */
@media (min-width: 768px) and (max-width: 1279px) { header nav { gap: 16px !important; font-size: 12px !important; letter-spacing: 0.08em !important; } }
@media (min-width: 768px) and (max-width: 899px) { header nav { gap: 9px !important; font-size: 11px !important; letter-spacing: 0.03em !important; } }
/* Phones in portrait: footer twice as tall */
@media (max-width: 767px) and (orientation: portrait) { :root { --footer-h: 86px; } }
</style>
</helmet>

    <div style="display: flex; gap: 40px; align-items: {{ headerAlign }}">

<main style="width: 100%; box-sizing: border-box; margin: 0 auto; padding: {{ mainPad }}; flex: 1; min-height: {{ mainMinH }}; display: flex; flex-direction: column; justify-content: center" data-screen-label="Home — Gallery">
  <section style="padding: {{ heroPad }}; display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0">
    <a href="{{ heroHref }}" style="display: block; width: {{ heroW }}; aspect-ratio: 1.494; justify-self: center; position: relative">
      <span aria-hidden="true" style="position: absolute; inset: 0; background: url(uploads/arbor-mark.png) center / auto 49.7% no-repeat; opacity: 0.25; pointer-events: none"></span>
      {{ heroImg }}
      <img src="uploads/intro-logo.png" alt="" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 72%; max-width: 900px; opacity: {{ introOpacity }}; transition: opacity 0.9s ease; pointer-events: none">
    </a>
    <div onTouchStart="{{ swipeStart }}" onTouchEnd="{{ swipeEnd }}" style="position: relative; margin-top: {{ railMargin }}; display: flex; align-items: {{ railAlign }}; justify-content: {{ railJustify }}; gap: {{ railGap }}; touch-action: pan-y">
      <button onClick="{{ prev }}" aria-label="Previous artwork" style="border: none; background: transparent; cursor: pointer; padding: 8px 8px {{ arrowPadBottom }} 0; margin-left: -2px; color: #ADA9A2; display: flex" style-hover="color: #6E6B66">
        <svg width="13" height="36" viewBox="0 0 22 60" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="21 1 1 30.66 21 59"></polyline></svg>
      </button>
      <div style="clip-path: {{ railClip }}; width: {{ railWidth }}; padding: 10px 0; flex: none">
        <div onMouseMove="{{ dockMove }}" onMouseLeave="{{ dockLeave }}" style="display: flex; gap: 22px; align-items: flex-end; width: max-content; will-change: transform; transform: {{ railShift }}; transition: {{ railTransition }}">
          <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="9">
            <button onClick="{{ t.select }}" aria-label="{{ t.alt }}" style="border: 1.5px solid {{ t.borderColor }}; background: transparent; padding: 0; cursor: pointer; flex: none; opacity: {{ t.opacity }}; visibility: {{ t.vis }}; display: block; position: relative; transform-origin: center bottom; transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease, border-color 0.35s ease" style-hover="opacity: 1">
              {{ t.img }}
            </button>
          </sc-for>
        </div>
      </div>
      <button onClick="{{ next }}" aria-label="Next artwork" style="border: none; background: transparent; cursor: pointer; padding: 8px 8px {{ arrowPadBottom }} 8px; color: #ADA9A2; display: flex" style-hover="color: #6E6B66">
        <svg width="13" height="36" viewBox="0 0 22 60" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="1 1 21 30.66 1 59"></polyline></svg>
      </button>
      <p style="position: absolute; top: 100%; left: 0; right: 0; margin: {{ hoverTitleMargin }}; line-height: 1.2; text-align: center; font-style: italic; font-size: 17px; font-weight: 300; letter-spacing: 0.04em; color: #8A8680; pointer-events: none; opacity: {{ hoverTitleOpacity }}; transition: opacity 0.45s ease">{{ hoverTitle }}</p>
    </div>
  </section>
</main>

<script type="text/x-dc" data-dc-script data-props="{
  &quot;autoplay&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Carousel&quot;},
  &quot;cartCount&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 1, &quot;min&quot;: 0, &quot;max&quot;: 9, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Header&quot;}
}">
class Component extends DCLogic {
  state = { mobile: typeof window !== 'undefined' && window.innerWidth < 768, tablet: typeof window !== 'undefined' && window.innerWidth < 1280, menuOpen: false, index: 0, hover: false, fade: false, ratio: 1.494, railBase: 0, animate: false, intro: true }; // ratio: the scans' proportion; the hero frame keeps it for every work
  // The carousel shows the uncropped gallery scans (paper border included). `cropped` keeps the original
  // cropped file for each piece in case it is wanted again. Titles must match the Gallery entries exactly.
  arts = [
    { src: 'assets/works/DSC01769.jpg', title: 'Brilliance', alt: 'Brilliance' }, // first, per Ned
    { src: 'assets/works/CORE_12.jpg', cropped: 'assets/art-1.png', title: 'Symbiosis', alt: 'Green field with red, ochre and white forms' },
    { src: 'assets/works/CORE_20.jpg', cropped: 'assets/art-2.png', title: 'Core 20', alt: 'Chartreuse field with blue-ringed forms' },
    { src: 'assets/works/CORE_11.jpg', cropped: 'assets/art-3.png', title: 'Script', alt: 'Red, black and yellow strokes on white' },
    { src: 'assets/works/CORE_14.jpg', cropped: 'assets/art-4.png', title: 'Articulation', alt: 'Color band study on textured paper', hidden: true }, // Ned does not want it shown
    { src: 'assets/works/CORE_16.jpg', cropped: 'assets/art-5.png', title: 'Habitat', alt: 'Sunset watercolor with green sprigs' },
    { src: 'assets/works/CORE_15.jpg', cropped: 'assets/art-6.png', title: 'Chamber', alt: 'Two framed panels on black ground' },
    { src: 'assets/works/CORE_17.jpg', cropped: 'assets/art-7.png', title: 'Core 17', alt: 'Ochre field with green and blue frames' },
    { src: 'assets/works/CORE_13.jpg', title: 'Conduit', alt: 'Conduit' },
    { src: 'assets/works/CORE_18.jpg', title: 'Upwelling', alt: 'Upwelling' }
  ].filter(a => !a.hidden);
  go(d) { this.show((this.state.index + d + this.arts.length) % this.arts.length); }
  // Dock-style magnification: the thumbnail under the cursor grows most, neighbours less (bell curve), all anchored
  // at their bottom edge and nudged sideways so they never overlap. Styles are set directly for smooth tracking.
  dockBase(strip) {
    this.dock = Array.from(strip.children).map(b => { const r = b.getBoundingClientRect(); return { cx: r.left + r.width / 2, w: r.width }; });
  }
  dockMove(e) {
    const strip = e.currentTarget; const btns = Array.from(strip.children);
    if (!this.dock || this.dock.length !== btns.length) this.dockBase(strip);
    const base = this.dock; const slot = base.length > 1 ? base[1].cx - base[0].cx : 100;
    const scales = base.map(b => 1 + 0.3 * Math.exp(-Math.pow((e.clientX - b.cx) / (1.15 * slot), 2)));
    const extra = scales.map((sc, k) => (sc - 1) * base[k].w);
    const total = extra.reduce((a, b) => a + b, 0);
    let acc = 0;
    btns.forEach((btn, k) => {
      const shift = acc + extra[k] / 2 - total / 2; acc += extra[k];
      btn.style.transition = 'transform 0.14s ease-out, opacity 0.35s ease, border-color 0.35s ease';
      btn.style.transform = 'translateX(' + shift.toFixed(1) + 'px) scale(' + scales[k].toFixed(3) + ')';
      btn.style.zIndex = String(Math.round(scales[k] * 100));
    });
  }
  dockLeave(e) {
    Array.from(e.currentTarget.children).forEach(btn => {
      btn.style.transition = 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease, border-color 0.35s ease';
      btn.style.transform = ''; btn.style.zIndex = '';
    });
    this.dock = null;
  }
  // finger swipe on the image or thumbnails: left = next, right = previous
  touchStart(e) { this.touchX = e.touches[0].clientX; }
  touchEnd(e) { const dx = e.changedTouches[0].clientX - this.touchX; if (Math.abs(dx) > 40) this.go(dx < 0 ? 1 : -1); }
  // The thumbnail tray keeps one extra thumbnail waiting off-stage on each side. Selecting a work slides the
  // whole strip by the slots travelled (0.95s ease), then re-centres it on the new work without a visible change.
  show(k) {
    if (k === this.state.index || this.state.fade || this.state.animate) return;
    this.setState({ fade: true });
    setTimeout(() => {
      this.setState({ index: k, fade: false, animate: true });
      setTimeout(() => this.setState({ railBase: k, animate: false }), 1000);
    }, 700);
  }
  // Fallback if an artwork file is missing: a light green box.
  ph(k) { return e => { e.currentTarget.src = 'assets/placeholder-landscape.svg'; }; }
  // Open menu: page scroll locked at the top, menu fixed below the header, footer pinned to the bottom of the screen
  setMenu(open) {
    document.body.style.overflow = open ? 'hidden' : '';
    if (open) window.scrollTo({ top: 0, behavior: 'instant' });
    this.setState({ menuOpen: open });
  }
  // Animated logo (H4): as H2, but once the sequence has finished the Tree of Life fades away, leaving the plain wordmark,
  // which eases up 8px so it sits exactly where the static logo sits on every other page.
  // Animated logo (secondary home): the wordmark SVG is fetched and inlined here rather than templated, then the
  // tree-to-ampersand sequence plays once (6.6s) and holds its final frame. The view covers the whole final mark
  // (leaves above the wordmark, stem below) and is sized so the letters' cap height matches the text logo (19.9px);
  // the text logo stays in the link, invisible, so the header keeps exactly the layout of every other page, and the
  // mark is overlaid with its letters 8px below that hidden text's baseline so the leaf tips clear the top of the page.
  async startLogo() {
    const holder = document.getElementById('ae-logo');
    if (!holder) return;
    holder.innerHTML = await (await fetch('uploads/logo-animation.svg')).text();
    const svg = holder.querySelector('svg');
    svg.setAttribute('viewBox', '132.4 57.8 1123.5 305.4');
    svg.style.overflow = 'visible';
    svg.style.fill = '#141414';
    const $ = id => holder.querySelector('#' + id);
    const clamp = p => p < 0 ? 0 : p > 1 ? 1 : p, seg = (e, t, d) => clamp((e - t) / d);
    const outCubic = p => 1 - Math.pow(1 - p, 3), inOutSine = p => -(Math.cos(Math.PI * p) - 1) / 2, inOutCubic = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    // fixed geometry of the tree and ampersand in the SVG's units (Safari cannot measure artwork inside <defs>,
    // so getBBox() there returns zeros and the tree would be drawn unscaled)
    const T = { cx: 573.56, cy: 959.55, h: 1211.5 }, A = { cx: 875.2, cy: 261.39, h: 150.42 };
    // START/LIFT0: the tree's opening scale and height above the ampersand centre (chosen so the whole tree sits inside
    // the header from the first frame); ENDS/LIFT1: its resting scale and height once it has settled into the wordmark
    const START = 2.3, ENDS = 2.035, LIFT0 = 20, LIFT1 = 51, SHIFTX0 = -3, SHIFTX1 = 0, END = 5.3, fit = A.h / T.h;
    const tree = $('ae-tree');
    const apply = e => {
      const treeIn = outCubic(seg(e, 0.1, 0.8)), textIn = outCubic(seg(e, 1.0, 2.2)), shrink = inOutSine(seg(e, 2.9, 1.04)), swap = inOutCubic(seg(e, 4.2, 1.0));   // the rise into place is 2.5x quicker than the storyboard (1.04s), and the ampersand swap follows straight after
      const sc = fit * (START + (ENDS - START) * shrink), lift = LIFT0 + (LIFT1 - LIFT0) * shrink, sx = SHIFTX0 + (SHIFTX1 - SHIFTX0) * shrink;
      tree.setAttribute('transform', 'translate(' + (A.cx + sx).toFixed(2) + ' ' + (A.cy - lift).toFixed(2) + ') scale(' + sc.toFixed(4) + ') translate(' + (-T.cx) + ' ' + (-T.cy) + ')');
      $('ae-tree-e').setAttribute('opacity', (treeIn * (1 - swap)).toFixed(3));
      $('ae-tree-keep').setAttribute('opacity', treeIn.toFixed(3));
      $('ae-core').setAttribute('opacity', (0.4 * swap).toFixed(3));
      $('ae-arbor').setAttribute('opacity', textIn.toFixed(3));
      $('ae-eye').setAttribute('opacity', textIn.toFixed(3));
      $('ae-amp').setAttribute('opacity', swap.toFixed(3));
    };
    const t0 = performance.now();
    const frame = now => {
      const e = Math.min((now - t0) / 1000, END); apply(e);
      if (e < END) this.logoRaf = requestAnimationFrame(frame);
      else setTimeout(() => {
        ['ae-tree-keep', 'ae-core'].forEach(id => { const g = $(id); g.style.transition = 'opacity 0.9s ease'; g.style.opacity = '0'; });
        holder.style.transition = 'transform 0.9s cubic-bezier(0.45, 0, 0.15, 1)'; holder.style.transform = 'translateY(-8px)';
      }, 400);
    };
    this.logoRaf = requestAnimationFrame(frame);
  }
  componentDidMount() {
    this.startLogo();
    this.arts.forEach(a => { const im = new Image(); im.src = a.src; }); // preload so swaps are instant
    this.introTimer = setTimeout(() => this.setState({ intro: false }), 3000); // wordmark overlay fades off after 3s
    this.mqPortrait = window.matchMedia('(orientation: portrait)');
    this.onMqPortrait = () => this.setState({ portrait: this.mqPortrait.matches });
    this.mqPortrait.addEventListener('change', this.onMqPortrait);
    this.setState({ portrait: this.mqPortrait.matches });
    this.mq = window.matchMedia('(max-width: 767px)');
    this.onMq = () => { document.body.style.overflow = ''; this.setState({ mobile: this.mq.matches, menuOpen: false }); };
    this.mq.addEventListener('change', this.onMq);
    this.setState({ mobile: this.mq.matches });
    this.mqTablet = window.matchMedia('(max-width: 1279px)');
    this.onMqTablet = () => this.setState({ tablet: this.mqTablet.matches });
    this.mqTablet.addEventListener('change', this.onMqTablet);
    this.setState({ tablet: this.mqTablet.matches });
    this.onKey = (e) => { if (e.key === 'ArrowLeft') this.go(-1); if (e.key === 'ArrowRight') this.go(1); };
    window.addEventListener('keydown', this.onKey);
    this.timer = setInterval(() => { if (this.props.autoplay) this.go(1); }, 5000);
  }
  componentWillUnmount() { if (this.mqPortrait) this.mqPortrait.removeEventListener('change', this.onMqPortrait); if (this.logoRaf) cancelAnimationFrame(this.logoRaf);
    if (this.mq) this.mq.removeEventListener('change', this.onMq); if (this.mqTablet) this.mqTablet.removeEventListener('change', this.onMqTablet);
    window.removeEventListener('keydown', this.onKey);
    clearInterval(this.timer);
    clearTimeout(this.introTimer);
  }
  renderVals() {
    const cartCount = this.props.cartCount ?? 1;
    const m = this.state.mobile, mp = m && this.state.portrait;
    const i = this.state.index;
    const n = this.arts.length;
    // Desktop: the image fits the height between header and footer (61px = header border + hero padding; the thumbnail
    // rail adds 4.5% of the image width) and never exceeds the content width; thumbnails scale with the image.
    // rail = thumbnail + 29px of padding/border; 30% of it overlaps the image, so 70% (0.0231 x width + 20px) sits below
    const k = this.state.ratio / (1 + 0.0231 * this.state.ratio);
    // Desktop / tablet: header + image + thumbnails fill the screen exactly (thumbnails sit at the bottom of the viewport,
    // footer follows below the fold). Budgets = section padding + the part of the tray that hangs below the image.
    const fitW = 'calc((100vh - var(--header-h) - 77px) * ' + k.toFixed(4) + ')'; // 77 = 35px above the image + 20px below the tray (the tray's own 15px of padding makes it 35 under the thumbnails) + the tray's overhang
    const smallFit = m ? 'calc((100vh - var(--header-h) - var(--footer-h) - 166px) * ' + this.state.ratio.toFixed(4) + ')' : 'calc((100vh - var(--header-h) - 98px) * ' + this.state.ratio.toFixed(4) + ')';
    // desktop / tablet: the image may run wider than the side padding (to 94% of the screen) so it can fill the height on very wide-and-tall screens
    const heroW = m ? 'min(100%, ' + smallFit + ')' : 'min(94vw, ' + (this.state.tablet ? smallFit : fitW) + ')';
    const thumbH = m ? '44px' : this.state.tablet ? '31px' : 'calc(min(94vw, ' + fitW + ') * 0.033)'; // desktop / tablet thumbnails are 60% of their earlier size
    const half = m ? 1 : 2; // 3 thumbnails on phones, 5 everywhere else, centred on the current work
    const base = this.state.railBase;
    const shown = Array.from({ length: 2 * half + 3 }, (_, j) => (base + j - half - 1 + n) % n); // one extra each side, off-stage
    let shift = (i - base + n) % n; if (shift > n / 2) shift -= n; // signed slots between the strip's centre and the selected work
    const slot = 'calc((' + thumbH + ') * 1.494 + 3px + 22px)'; // scans are 1.494:1; 3px = border; 22px gap
    return {
      cartCount,
      showCartBadge: cartCount > 0,
      isMobile: m,
      headerAlign: m ? 'center' : 'baseline', // phones have no nav text to align to
      isDesktop: !m,
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setMenu(!this.state.menuOpen),
      footerPos: this.state.menuOpen ? 'fixed' : 'static',
      barTop: this.state.menuOpen ? 'translateY(6.5px) rotate(45deg)' : 'none',
      barMid: this.state.menuOpen ? 0 : 1,
      barBot: this.state.menuOpen ? 'translateY(-6.5px) rotate(-45deg)' : 'none',
      menuTransform: this.state.menuOpen ? 'translateY(0)' : 'translateY(-100%)',
      menuVis: this.state.menuOpen ? 'visible' : 'hidden',
      narrow: m, // whenever the hamburger shows, the account and cart icons move into the menu
      headerIconsDisplay: m ? 'none' : 'flex',
      badgeDisplay: cartCount > 0 ? 'inline-flex' : 'none',
      closeMenu: () => this.setMenu(false),
      mainPad: '0 var(--side-pad)',
      heroPad: mp ? '32px 0 44px' : m ? '32px 0' : '35px 0 20px', // 35px above the image and 35px below the thumbnails (20 here + the tray's 15), so the block sits centred between header and fold; the hover title (8px gap + one line) fits inside the lower 30px
      mainMinH: m ? '0' : 'calc(100vh - var(--header-h) - 1px)', // phones keep the footer on screen; larger screens push it below the fold
      // phones in portrait: thumbnails overlap the image by 20% of their height (the tray's 10px padding is inside the overlap)
      railMargin: mp ? 'calc(-0.2 * ' + thumbH + ' - 11.5px)' : m ? '28px' : 'calc(-0.3 * (' + thumbH + ' + 23px))',
      railAlign: m ? 'center' : 'flex-end', // phones (no overlap): arrows centred on the thumbnails; otherwise on their baseline
      arrowPadBottom: m ? '8px' : '12px', // tray padding (10px) + thumbnail border (1.5px) puts the chevron on the thumbnail baseline
      railJustify: m ? 'space-between' : 'center', // phones: arrows pushed out to the image's edges, thumbnails centred between them
      imgW: m ? 'auto' : '100%',
      imgMaxH: m ? '100%' : 'none',
      railGap: m ? '4px' : this.state.tablet ? '40px' : '56px',
      thumbH,
      heroImg: React.createElement('img', { src: this.arts[i].src, alt: this.arts[i].alt, onError: this.ph(i), onTouchStart: e => this.touchStart(e), onTouchEnd: e => this.touchEnd(e), onMouseEnter: () => this.setState({ hover: true }), onMouseLeave: () => this.setState({ hover: false }), style: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', display: 'block', touchAction: 'pan-y', boxShadow: '0 6px 16px rgba(20,20,20,0.14)', opacity: this.state.fade ? 0 : 1, transition: 'opacity 0.7s ease-in-out' } }),
      heroW,
      heroHref: 'Gallery.dc.html#' + encodeURIComponent(this.arts[i].title),
      introOpacity: this.state.intro ? 1 : 0,
      hoverTitle: this.arts[i].title,
      hoverTitleOpacity: this.state.hover ? 1 : 0,
      hoverTitleMargin: mp ? '8.5px 0 0' : '0', // portrait phones: 20px clear between thumbnails and title (10 tray padding + 1.5 border + 8.5)
      prev: () => this.go(-1),
      // one slot = thumbnail width (about 1.5 x its height) + padding/border + gap
      railWidth: 'calc(' + (2 * half + 1) + ' * ' + slot + ' - 22px)',
      railShift: 'translateX(calc(' + (-(1 + shift)) + ' * ' + slot + '))',
      railTransition: this.state.animate ? 'transform 0.95s cubic-bezier(0.55, 0, 0.1, 1)' : 'none',
      railClip: this.state.animate ? 'inset(-120px 0 -20px 0)' : 'inset(-120px -60px -20px -60px)',
      dockMove: (e) => this.dockMove(e),
      dockLeave: (e) => this.dockLeave(e),
      swipeStart: (e) => this.touchStart(e),
      swipeEnd: (e) => this.touchEnd(e),
      next: () => this.go(1),
      thumbs: shown.map((k, j) => ({
        vis: (j === 0 || j === shown.length - 1) && !this.state.animate ? 'hidden' : 'visible',
        img: React.createElement('img', { src: this.arts[k].src, alt: '', onError: this.ph(k), style: { display: 'block', height: thumbH, width: 'auto' } }),
        alt: 'Show ' + this.arts[k].alt,
        borderColor: k === i ? '#141414' : '#E7E4DE',
        opacity: k === i ? 1 : 0.75,
        select: () => this.show(k)
      }))
    };
  }
}
</script>
