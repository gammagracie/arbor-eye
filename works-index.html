<style>
/* screens over 2000px wide: every font size 25% larger (since 2026-10-19; each font-size is multiplied by --fs; the
   logo's hidden text and H0's hover title are left out) */
:root { --fs: 1; }
@media (min-width: 2001px) { :root { --fs: 1.25; } }

/* Shared site tokens: header/footer heights and side padding match the other pages */
:root { --header-h: clamp(72px, 57px + 1.172vw, 80px); --footer-h: clamp(30.1px, 13.3px + 1.3013vw, 37.8px);   /* (since 2026-10-28) 70% of the earlier 43 - 54px */ --side-pad: 24px; --thumb-h: 25px; --step-w: clamp(32px, 5.8vw, 84px); }
@media (min-width: 768px) { :root { --thumb-h: 30px; } }
@media (min-width: 768px) { :root { --side-pad: 48px; } }
@media (min-width: 1024px) { :root { --side-pad: 10vw; } }
html, body { height: 100%; margin: 0; }
body { background: #FDFDFB; color: #141414; font-family: "Neuzeit Grotesk", "Helvetica Neue", Helvetica, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: #141414; text-decoration: none; }
a:hover { color: #6E6B66; }
button { font-family: inherit; }
::selection { background: #E9E6DF; }

/* header + work + thumbnails fill the screen exactly; the footer sits below the fold and is reached by scrolling */
.page { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
/* Phones in portrait: footer twice as tall and kept on screen (header, work and filmstrip share the rest of the height) */
@media (max-width: 767px) and (orientation: portrait) { :root { --footer-h: 86px; } .page { height: calc(100vh - var(--footer-h)); height: calc(100dvh - var(--footer-h)); } }

/* header */
header { flex: none; border-bottom: 1px solid #E7E4DE; background: #FDFDFB; position: relative; z-index: 30; }
.bar { height: var(--header-h); box-sizing: border-box; padding: 0 var(--side-pad); display: flex; flex-wrap: wrap; align-content: center; align-items: baseline; justify-content: space-between; gap: 32px; }
.logo { position: relative; display: block; width: 188.2px; overflow: visible; font-family: 'EB Garamond', serif; font-size: 29px; letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap; }
.logo .logo-text { visibility: hidden; }
.logo .logo-text span { font-style: italic; text-transform: none; letter-spacing: 0; }
.right, .icons { display: flex; align-items: baseline; }
.right { gap: 40px; } .icons { gap: 20px; }
nav.main { display: flex; gap: 40px; font-size: calc(13px * var(--fs)); letter-spacing: 0.18em; text-transform: uppercase; }
nav.main .on { font-weight: 600; }
.icons a { display: flex; position: relative; }
.badge { position: absolute; top: -6px; right: -8px; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #141414; color: #FDFDFB; font-size: calc(9px * var(--fs)); }
.burger { display: none; border: none; background: transparent; padding: 8px 0 8px 8px; cursor: pointer; gap: 5px; }
.burger span { display: block; width: 20px; height: 1.5px; background: #141414; transition: transform 0.2s, opacity 0.2s; }
body.menu-open .burger span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
body.menu-open .burger span:nth-child(2) { opacity: 0; }
body.menu-open .burger span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
.menu { position: fixed; top: var(--header-h); bottom: 0; left: 0; right: 0; z-index: 20; background: #FDFDFB; display: grid; align-content: start; padding: 8px 24px 20px; font-size: calc(13px * var(--fs)); letter-spacing: 0.16em; text-transform: uppercase; transform: translateY(-100%); visibility: hidden; transition: transform 0.3s ease, visibility 0.3s; }
body.menu-open .menu { transform: translateY(0); visibility: visible; }
.menu a { padding: 28px 0; border-bottom: 1px solid #F0EDE7; display: flex; align-items: center; gap: 14px; }
.menu a:last-child { border-bottom: none; }
@media (max-width: 767px) {
  .bar { align-items: center; }
  nav.main, .icons a { display: none; }
  .burger { display: grid; }
}

/* stage: the selected work, as large as the space allows */
/* the work may grow past the page's side padding (out to 3% of the screen) so it is as large as the window allows */
/* view switch (top left, lined up with the logo like the grid gallery's switcher): 1 work, 3 in a row, or 9 in three rows of three; phones are always one-up */
.tools { flex: none; display: flex; justify-content: flex-start; align-items: center; gap: 14px; padding: 14px var(--side-pad) 0; position: relative; z-index: 6; }
/* filter menus (top right, on the bag icon's line, as on the grid gallery): Series and Year */
.filters { margin-left: auto; display: flex; gap: 48px; }
.filter-menu { position: relative; }
.fm-btn { display: flex; align-items: center; gap: 8px; border: none; background: transparent; padding: 0 0 5px; font-family: inherit; font-size: calc(12px * var(--fs)); letter-spacing: 0.16em; text-transform: uppercase; color: #141414; cursor: pointer; }
.fm-list { position: absolute; top: 100%; right: 0; z-index: 25; width: 240px; margin-top: 6px; background: #FDFDFB; border-top: 1.5px solid #141414; box-shadow: 0 14px 36px rgba(20,20,20,0.12); padding: 14px 0 12px; display: none; }
.filter-menu.open .fm-list { display: grid; }
.fm-list button { text-align: left; border: none; background: transparent; padding: 11px 32px; font-family: inherit; font-size: calc(14px * var(--fs)); font-weight: 300; letter-spacing: 0.08em; color: #141414; cursor: pointer; white-space: nowrap; }
.fm-list button:hover { color: #6E6B66; } .fm-list button.on { color: #141414; font-weight: 600; }
.fm-btn.chosen span { font-weight: 600; }
.fm-list .fm-note { padding: 8px 32px 2px; font-size: calc(11px * var(--fs)); letter-spacing: 0.1em; color: #ADA9A2; }
@media (max-width: 767px) { .tools { display: none; } }
.count { border: none; background: transparent; padding: 2px; cursor: pointer; display: flex; color: #C9C5BD; transition: color 0.2s ease; }
.count:hover { color: #6E6B66; } .count.on { color: #141414; }
.count svg { width: 17px; height: 17px; fill: currentColor; display: block; }
.stage { flex: 1; min-height: 0; position: relative; margin: 10px var(--side-pad) 0; overflow: hidden; }
@media (min-width: 768px) { .stage { margin: 10px max(24px, 3vw) 0; } }
/* the arrows, locked in every view from the first paint: the left chevron's point on the logo's left edge, the right one's on
   the bag icon's right edge (side padding, less the stage's margin, less the point's 1/22 of the chevron's width) */
@media (min-width: 768px) {
  .step.prev { left: calc(var(--side-pad) - max(24px, 3vw) - clamp(9.75px, 1.31625vw, 19.0125px) / 22); }
  .step.next { right: calc(var(--side-pad) - max(24px, 3vw) - clamp(9.75px, 1.31625vw, 19.0125px) / 22); }
}
/* the featured works sit in a centred row, all the same height, a gap apart */
.row { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 28px; }
.row.grid { display: grid; grid-template-columns: repeat(3, auto); justify-items: center; align-items: center; row-gap: 48px; column-gap: 60px; }   /* 9-up: three columns 60px apart, rows 48px apart, room under each work for its title */
.row.grid .art img { object-fit: contain; }   /* 9-up: every landscape shares one 3:2 box so the columns line up; a scan not exactly 3:2 is fitted inside it, never trimmed */
.art { position: relative; flex: none; display: block; box-shadow: 0 6px 16px rgba(20,20,20,0.14); cursor: pointer; transition: transform 0.9s cubic-bezier(0.25, 0.1, 0.25, 1); }
html:not(.touch) .art:hover { transform: scale(1.075); z-index: 2; }   /* hover: a centre-out enlargement (1.03 until 2026-10-29, then 2.5 times the growth) */
.art img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 0.9s ease-in-out; -webkit-user-drag: none; user-select: none; }
.stage { touch-action: pan-y; }
.art img.on { opacity: 1; }
/* previous / next chevrons either side of the work (placed by fit()) */
.step { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; transition: left 0.95s cubic-bezier(0.6, 0, 0.2, 1), right 0.95s cubic-bezier(0.6, 0, 0.2, 1); width: var(--step-w); height: 150px; padding: 0; border: none; background: transparent; color: #ADA9A2; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color 0.2s ease; }
.step:hover { color: #6E6B66; }
.step.prev { justify-content: flex-start; } .step.next { justify-content: flex-end; }
.step svg { width: clamp(9.75px, 1.31625vw, 19.0125px); height: auto; }   /* 65% of the earlier size since 2026-10-19 (49% of the original): 19 x 53px on a 1440px screen, scaling down with the viewport to 9.75 x 27px */
.caption { flex: none; height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: 'EB Garamond', serif; font-size: calc(16px * var(--fs)); font-style: normal; letter-spacing: 0.1em; text-transform: uppercase; color: #141414; opacity: 0; transition: opacity 0.35s ease, transform 0.25s ease; }
.caption small { font-family: "Neuzeit Grotesk", "Helvetica Neue", Helvetica, sans-serif; font-style: normal; font-size: calc(10px * var(--fs)); letter-spacing: 0.2em; text-transform: uppercase; color: #ADA9A2; }
.page.hovering .caption { opacity: 1; }
html.touch .caption { opacity: 1; }
/* touch screens: title and arrows are hidden while anything moves (slides, crossfades, swipes, the strip, page scrolling) */
html.touch .page.moving .caption, html.touch .page.moving .step { opacity: 0; transition: opacity 0.15s ease; }

/* filmstrip: every work in one row, anchored above the footer. The row is a track moved by transform (fluid,
   eased) and thumbnails magnify under the cursor or finger; the wrap's top padding is headroom for them. */
.strip-wrap { flex: none; position: relative; z-index: 5; margin-top: -120px; padding: 120px 0 14px; pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--side-pad), #000 calc(100% - var(--side-pad)), transparent);
          mask-image: linear-gradient(90deg, transparent, #000 var(--side-pad), #000 calc(100% - var(--side-pad)), transparent); }
.strip { overflow: visible; padding: 6px 0; }
.track { display: flex; gap: 6px; align-items: flex-end; width: max-content; padding: 0 var(--side-pad); will-change: transform; pointer-events: auto; }
.thumb { flex: none; height: var(--thumb-h); padding: 0; border: none; background: none; cursor: pointer; position: relative; transform-origin: center bottom; transition: transform 0.16s ease-out, opacity 0.3s ease; }
.thumb img { display: block; height: var(--thumb-h); width: auto; box-shadow: 0 2px 8px rgba(20,20,20,0.12); transition: box-shadow 0.35s ease; }
.thumb.on img { box-shadow: 0 4px 12px rgba(20,20,20,0.38); }   /* the works featured in the main area: a deeper shadow */
html.touch .track { touch-action: none; }

/* footer */
footer { flex: none; height: var(--footer-h); box-sizing: border-box; border-top: 1px solid #E7E4DE; background: #FAF9F5; position: relative; z-index: 25; }
.foot { height: 100%; box-sizing: border-box; padding: 0 var(--side-pad); display: flex; align-items: center; justify-content: space-between; gap: 24px; font-size: calc(12px * var(--fs)); color: #0F0F0F; }
.foot p { margin: 0; }
.social { display: flex; gap: 16px; align-items: center; }
.social a { display: flex; opacity: 0.85; } .social a:hover { opacity: 1; }
.social img { display: block; width: 27.5px; height: 27.5px; }
/* TEMP: while G5 / G6 / G7 are in the nav, tighten it at tablet widths so the header stays on one line */
@media (min-width: 768px) and (max-width: 1919px) { header nav { gap: 16px !important; font-size: calc(12px * var(--fs)) !important; letter-spacing: 0.08em !important; } }
@media (min-width: 768px) and (max-width: 899px) { header nav { gap: 9px !important; font-size: calc(11px * var(--fs)) !important; letter-spacing: 0.03em !important; } }

/* ---- Index: every work as a small thumbnail, one row per series in Ned's deck order (Series 1, Ascent to Series 8, Tonal,
   then the Outliers); the thumbnails touch, each at its own shape and one height, and the rows sit directly on one another.
   Hovering a thumbnail brings up the genie (see below), names its series once, centred above the thumbnails, and fades the other rows to 25%; a click opens
   G5 one-up on that work, its series chosen in the filter (since 2026-10-24; on 2026-10-22 and 23 it opened the series grid). */
/* (since 2026-10-20) the page fills the screen less the footer, so the footer is on screen on load whenever the index fits (as on
   Ned's 3840 x 2160 screen); the spare height is shared out as equal space around each row, so the rows sit vertically centred */
.page.index { height: auto; min-height: 100vh; min-height: 100dvh; }   /* (since 2026-10-29) the footer always below the fold, seen only at the very bottom (it was on screen whenever the index fitted) */
:root { --idx-h: clamp(42px, 5.133vw, 197px); --idx-gap: calc(var(--idx-h) * 0.1); }   /* 74px tall on a 1440px screen, growing with the screen; (since 2026-10-29) a gap of a tenth of that between thumbnails and between rows (10px at 1920, 20px at 3840: the rows' spacing on Ned's screen) */
.idx { flex: 1; display: flex; flex-direction: column; gap: var(--idx-gap); padding: 16px var(--side-pad) 50px; }   /* 50px under the rows = the 16px and the series label's 34px above them */
.idx > .idx-row { margin-block: auto; }
.idx-series { margin: 0 0 14px; height: 20px; text-align: center; font-size: calc(13px * var(--fs)); letter-spacing: 0.22em; text-transform: uppercase; color: #141414; opacity: 0; transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
.idx-series.show { opacity: 1; }
.idx-row { transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.idx.hovering .idx-row { opacity: 0.25; }   /* (since 2026-10-29, as martonperlaki.com/thumbnails) the other rows fade to 25% over 0.3s while one is hovered; the names fade in over 0.6s on the same curve */
.idx.hovering .idx-row.on { opacity: 1; }
.idx-row { --ih: var(--idx-h); display: flex; flex-wrap: wrap; gap: var(--idx-gap); }
.idx-item { position: relative; display: block; flex: none; height: var(--ih); transform-origin: center bottom; transition: transform 0.9s cubic-bezier(0.25, 0.1, 0.25, 1), box-shadow 0.9s cubic-bezier(0.25, 0.1, 0.25, 1); }   /* hover growth (since 2026-10-21): slow and soft both ways, 0.9s on a gentle ease, the same coming back */
/* the genie, as on G5 (since 2026-10-29): the thumbnail under the cursor swells most (150%), its neighbours less along a wide
   bell curve, each growing up from its own base and nudged sideways so they never overlap (set by the script below) */
.idx-item.hot { z-index: 3; box-shadow: 0 6px 18px rgba(20,20,20,0.22); }
.idx-item img { display: block; height: 100%; width: auto; }
.idx-item.v { height: calc(var(--ih) * 1.5); }   /* (since 2026-10-24) a portrait the same size as a landscape, turned upright: as tall as a landscape is wide (the Ascent and Structure rows are that much taller) */
/* (since 2026-10-21) the hovered work's title to the right of its row, 24px past the row's last thumbnail and centred on the row
   (EB Garamond italic capitals, as the galleries' hover titles); placed by the script below, kept within the page's side padding */
.idx { position: relative; }
.idx-title { position: absolute; left: 0; top: 0; margin: 0; white-space: nowrap; font-family: 'EB Garamond', serif; font-style: normal; font-size: calc(clamp(16px, calc(0.8vw + 4.5px), 27px) * var(--fs) * 0.54); letter-spacing: 0.1em; text-transform: uppercase; color: #141414; opacity: 0; transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.45s cubic-bezier(0.25, 0.1, 0.25, 1); pointer-events: none; }
.idx-title.show { opacity: 1; }
/* (since 2026-10-28) Series and Year menus at the top right, on the bag icon's line, as on G5: a series shows only its row,
   Horizontal / Vertical and a year only the matching works, each remaining row still on its own line */
.index .tools { padding-top: 14px; }
.idx-row[hidden], .idx-item[hidden] { display: none; }
/* (since 2026-10-29) the spread-out layouts, sized by the script below: one series (.m-s), Horizontal (.m-h) and Vertical (.m-v).
   Rows centred, each work's title under it on hover (as on G5); one series and Vertical enlarge the works and hover them as
   G5's grid does (107.5%, 0.9s), Horizontal keeps the genie */
.idx.m-s .idx-row, .idx.m-h .idx-row, .idx.m-v .idx-row { justify-content: center; }
.idx.m-s .idx-row, .idx.m-v .idx-row { margin-inline: auto; }
.idx.m-h .idx-row { flex-wrap: nowrap; }
.idx.m-v > .idx-row { margin-block: 0; }   /* Vertical (since 2026-10-29): the rows close under the series name, not centred */
.idx.m-s .idx-item, .idx.m-v .idx-item { transform-origin: center center; }
.idx.m-s .idx-item.hot, .idx.m-v .idx-item.hot { transform: scale(1.075); }   /* (1.03 until 2026-10-29) */
</style>

<script>
// mobile menu
document.getElementById('burger').addEventListener('click', () => document.body.classList.toggle('menu-open'));
// hovering a thumbnail: its series named above the thumbnails, its title to the right of its row, the other rows dimmed
const idx = document.getElementById('idx'), label = document.getElementById('idxSeries'), title = document.getElementById('idxTitle');
// (since 2026-10-29) the layout: 'all' (every series, or a year), 's' (one series, spread out and enlarged), 'h' (Horizontal), 'v' (Vertical)
let mode = 'all';
const TGAP = 18;   // a hover title's gap under its work, in the spread-out layouts (4px more since 2026-10-29)
function placeTitle(row) {
  const box = idx.getBoundingClientRect(), pad = parseFloat(getComputedStyle(idx).paddingRight);
  let x, y;
  if (mode === 'all') {   // to the right of the row: 24px past its last thumbnail, centred on the row
    const items = row.querySelectorAll('.idx-item:not([hidden])'), last = items[items.length - 1];   // (its resting place, plus the genie's push)
    y = last.offsetTop + last.offsetHeight / 2 - title.offsetHeight / 2 + 9;   // (5px below the row's middle since 2026-10-22, 9px since 2026-10-29)
    x = Math.min(last.offsetLeft + last.offsetWidth + (row._titleShift || 0) + 24, box.width - pad - title.offsetWidth);   // never past the bag icon's line
  } else {   // under the hovered work, centred on it (following it where the genie nudges it)
    const it = row._hot; if (!it) return;
    x = Math.max(pad, Math.min(it.offsetLeft + it.offsetWidth / 2 + (it._dx || 0) - title.offsetWidth / 2, box.width - pad - title.offsetWidth));
    y = it.offsetTop + it.offsetHeight * (mode === 'h' ? 1 : 1.0375) + TGAP;   // (under its hover size: centre-out 107.5%; the genie grows upward)
  }
  const jump = !title.classList.contains('show');   // a title coming into view is put in place at once, only then follows the swell
  if (jump) title.style.transition = 'none';
  title.style.transform = 'translate(' + x.toFixed(1) + 'px, ' + y.toFixed(1) + 'px)';
  if (jump) { void title.offsetWidth; title.style.transition = ''; }
}
// the genie, as on G5 (since 2026-10-29; it was 120% from each centre): the thumbnails on the cursor's line of its row swell
// along a bell curve centred on the cursor (150% at its peak, spreading 1.7 thumbnails either way), each growing up from its
// base and nudged sideways so they never overlap, the thumbnail under the cursor staying under it; following the cursor
// softly (0.45s); leaving the row lets them settle back (0.5s)
const PEAK = 0.5;
function genie(row, x, item) {
  const box = idx.getBoundingClientRect(), line = [...row.querySelectorAll('.idx-item:not([hidden])')].filter(it => it.offsetTop === item.offsetTop);
  const base = line.map(it => ({ cx: box.left + it.offsetLeft + it.offsetWidth / 2, w: it.offsetWidth }));
  const slot = base.reduce((t, b) => t + b.w, 0) / base.length;
  const sc = base.map(b => 1 + PEAK * Math.exp(-Math.pow((x - b.cx) / (1.7 * slot), 2)));
  const extra = sc.map((v, k) => (v - 1) * base[k].w), total = extra.reduce((a, b) => a + b, 0);
  let pivot = 0;   // the growth left of the cursor, taken off every shift so the thumbnail under the cursor stays put
  base.forEach((b, k) => { pivot += extra[k] * Math.max(0, Math.min(1, (x - b.cx + b.w / 2) / b.w)); });
  let acc = 0;
  line.forEach((it, k) => {
    const shift = acc + extra[k] / 2 - pivot; acc += extra[k];
    it._dx = shift;
    it.style.transition = 'transform 0.45s cubic-bezier(0.25, 0.1, 0.25, 1), box-shadow 0.45s ease';
    it.style.transform = 'translateX(' + shift.toFixed(1) + 'px) scale(' + sc[k].toFixed(3) + ')';
    it.style.zIndex = String(Math.round(sc[k] * 100));
  });

function settle(row) {

const fine = matchMedia('(hover: hover) and (pointer: fine)');
document.querySelectorAll('.idx-row').forEach(row => {

// ---- (since 2026-10-28) Filters, as on G5: Series (each series, or horizontal / vertical works) and Year, one at a time
// (choosing one sets the other back to all). A year shows only the matching works, rows left with none hidden. Years come
// from G5's list of works (Outliers and Spectrum have none yet). (Since 2026-10-29) a series moves to the middle of the
// screen and spreads out, enlarged, in the rows below; Horizontal and Vertical centre their rows, spaced out (sizes in layout()).
const $ = id => document.getElementById(id);
let fSeries = 'All', fYear = 'All';
const SERIES_OPTS = [['All', 'All Series'], ['Ascent'], ['Convergence'], ['Core'], ['Select'], ['Spectrum'], ['Structure'], ['The Turning'], ['Tonal'], ['Horizontal'], ['Vertical']];
const yearOpts = () => [['All', 'All Years']].concat([...new Set([...document.querySelectorAll('.idx-item[data-y]')].map(a => a.dataset.y))].sort((a, b) => b - a).map(y => [y]));
// one series on its own: works per row (the last row centred under the others)
const SERIES_COLS = { 'Ascent': 6, 'Convergence': 3, 'Core': 3, 'Select': 3, 'Spectrum': 2, 'Structure': 3, 'The Turning': 3, 'Tonal': 2 };
// rows set by hand where the plain split would differ, each centred (Convergence 3/2/2, 2026-10-29)
const SERIES_ROWS = { 'Convergence': [3, 2, 2] };
// sized as if in rows of this many, then scaled (the page may scroll): Convergence 25% larger than in its earlier rows of 4,
// Spectrum 35% larger
const SERIES_SIZE = { 'Convergence': [4, 1.25], 'Spectrum': [2, 1.35] };
const thumbH = () => Math.min(197, Math.max(42, innerWidth * 0.05133));   // --idx-h
function layout() {
  const rows = [...document.querySelectorAll('.idx-row')];
  rows.forEach(r => r.removeAttribute('style'));
  document.querySelectorAll('.idx-item').forEach(a => { a.style.marginLeft = a.style.marginRight = ''; });
  idx.style.gap = '';
  idx.classList.remove('m-s', 'm-h', 'm-v');
  if (mode === 'all') return;
  idx.classList.add('m-' + mode);
  const cs = getComputedStyle(idx), aw = idx.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const th = parseFloat(getComputedStyle(title).fontSize) * 1.25, H = thumbH();
  const gx = Math.max(25, aw * 0.02), gy = TGAP + th + Math.max(18, gx * 0.7);   // at least 25px between works; under each, room for its title
  const shown = rows.filter(r => !r.hidden);
  const set = (row, ih, cols, w, colGap, rowGap) => {
    row.style.setProperty('--ih', ih.toFixed(2) + 'px');
    if (cols) row.style.width = (cols * w + (cols - 1) * colGap + 1).toFixed(1) + 'px';
    row.style.columnGap = colGap.toFixed(1) + 'px'; row.style.rowGap = rowGap.toFixed(1) + 'px';
  };
  if (mode === 's') {   // as large as fits with room round it: up to 8 times a thumbnail's area (2.83 times as wide and tall)
    const row = shown[0]; if (!row) return;
    const items = row.querySelectorAll('.idx-item:not([hidden])'), n = items.length, v = items[0].classList.contains('v'), r = v ? 2 / 3 : 3 / 2;
    let split = SERIES_ROWS[row.dataset.s];
    if (!split || split.reduce((a, b) => a + b, 0) !== n) split = null;
    const cols = split ? Math.max(...split) : Math.min(n, SERIES_COLS[row.dataset.s] || 3), nr = split ? split.length : Math.ceil(n / cols);
    const top = idx.getBoundingClientRect().top + se.scrollTop + parseFloat(cs.paddingTop) + label.offsetHeight + 14;
    const ah = innerHeight - top - parseFloat(cs.paddingBottom);
    const fit = (c, k) => Math.min((aw * 0.9 - (c - 1) * gx) / c / r, (ah * 0.94 - (k - 1) * gy - TGAP - th) / k);
    const sz = SERIES_SIZE[row.dataset.s];
    const h = sz ? Math.min(sz[1] * Math.min(fit(sz[0], Math.ceil(n / sz[0])), 2.83 * (v ? 1.5 * H : H)), (aw * 0.9 - (cols - 1) * gx) / cols / r)

    if (split) {   // a shorter row is held in by equal margins on its outer works, so it breaks where it should, centred
      let i = 0;
      split.forEach(k => { const pad = ((cols - k) * (h * r + gx) / 2).toFixed(2) + 'px'; items[i].style.marginLeft = pad; items[i + k - 1].style.marginRight = pad; i += k; });
    }
  } else if (mode === 'v') {   // up to 4 times a thumbnail's area (twice as wide and tall); Ascent in rows of 6, extra space between the series
    // (since 2026-10-29) the rows 75% as far apart as before and every work on screen on load: smaller where the rows would not fit
    const ry = gy * 0.75, sy = gy * 1.8 * 0.75, ns = shown.map(row => row.querySelectorAll('.idx-item:not([hidden])').length);
    const most = Math.max(...ns.map(n => Math.min(6, n))), nr = ns.reduce((a, n) => a + Math.ceil(n / 6), 0);
    const top = idx.getBoundingClientRect().top + se.scrollTop + parseFloat(cs.paddingTop) + label.offsetHeight + 14;
    const ah = innerHeight - top - H * 0.1 - 16, hov = 1 + (1.075 - 1) / 2;   // (the usual 10% gap under the name; 16px clear under the last title)
    const h = Math.min(3 * H, (aw * 0.95 - (most - 1) * gx) / most * 1.5,
      (ah - (nr - shown.length) * ry - (shown.length - 1) * sy - TGAP - th) / (nr - 1 + hov));
    shown.forEach((row, k) => { const cols = Math.min(6, ns[k]); set(row, h / 1.5, cols, h * 2 / 3, gx, ry); });
    idx.style.gap = sy.toFixed(1) + 'px';
    shown[0].style.marginTop = (H * 0.1 - sy).toFixed(1) + 'px';   // (the series gap is not kept under the name)
  } else {   // Horizontal: each series still one row, 25% larger (less if the longest row would not fit), a little apart
    const g = H * 0.15, most = Math.max(...shown.map(row => row.querySelectorAll('.idx-item:not([hidden])').length));
    const h = Math.min(1.25 * H, (aw - (most - 1) * g) / most / 1.5);
    shown.forEach(row => set(row, h, 0, 0, g, g));
    idx.style.gap = ((TGAP + th + g * 2) * 0.65).toFixed(1) + 'px';   // (65% of the earlier spacing since 2026-10-29: still clear of a title under a row)
  }

    img.dataset.big = 1; const big = img.getAttribute('src').replace('assets/thumbs-m70/', 'assets/works-m70/'), pre = new Image();

}
// changing the filter: works leaving fade out (0.3s); the rest glide from where they were to where they now go, growing or
// shrinking on the way (0.8s), and works arriving fade in
let flipping = false, flipT = 0;
function applyFilter() {
  const rows = [...document.querySelectorAll('.idx-row')], items = [...document.querySelectorAll('.idx-item')];
  rows.forEach(settle); idx.classList.remove('hovering'); label.classList.remove('show'); title.classList.remove('show');
  const vis = a => !a.hidden && !a.closest('.idx-row').hidden;
  const was = new Set(items.filter(vis)), next = new Set();
  rows.forEach(row => {
    const inSeries = fSeries === 'All' || fSeries === 'Horizontal' || fSeries === 'Vertical' || row.dataset.s === fSeries;
    row.querySelectorAll('.idx-item').forEach(a => {
      const v = a.classList.contains('v');
      if (inSeries && (fSeries !== 'Horizontal' || !v) && (fSeries !== 'Vertical' || v) && (fYear === 'All' || a.dataset.y === fYear)) next.add(a);
    });
  });
  const leaving = [...was].filter(a => !next.has(a));
  flipping = true;
  const go = () => {
    const first = new Map([...was].filter(a => next.has(a)).map(a => [a, a.getBoundingClientRect()]));
    items.forEach(a => { a.hidden = !next.has(a); a.style.opacity = ''; });
    rows.forEach(row => { row.hidden = !row.querySelector('.idx-item:not([hidden])'); });
    mode = fSeries === 'Horizontal' ? 'h' : fSeries === 'Vertical' ? 'v' : fSeries !== 'All' ? 's' : 'all';
    layout();

      moving.forEach(a => { a.style.transition = 'transform 0.8s cubic-bezier(0.22, 1, 0.36, 1)'; a.style.transform = ''; });

}
addEventListener('resize', () => { if (mode !== 'all') layout(); });
const menuRenders = [];
function menu(id, label, opts, get, set) {
  const m = $(id), btn = m.querySelector('.fm-btn'), list = m.querySelector('.fm-list');
  const render = () => {
    btn.querySelector('span').textContent = get() === 'All' ? label : get();
    btn.classList.toggle('chosen', get() !== 'All');
    list.innerHTML = '';

      o.addEventListener('click', e => { e.stopPropagation(); set(v); close(); menuRenders.forEach(r => r()); applyFilter(); }); list.appendChild(o); });

function close() { document.querySelectorAll('.filter-menu.open').forEach(x => { x.classList.remove('open'); x.querySelector('.fm-btn').setAttribute('aria-expanded', 'false'); }); }
menu('fmSeries', 'Series', () => SERIES_OPTS, () => fSeries, v => { fSeries = v; if (v !== 'All') fYear = 'All'; });
menu('fmYear', 'Year', yearOpts, () => fYear, v => { fYear = v; if (v !== 'All') fSeries = 'All'; });

addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

// ---- (since 2026-10-28) Mouse wheel: whenever the page is taller than the screen, the wheel glides it, as on G6 (each step

const se = document.scrollingElement, maxY = () => se.scrollHeight - innerHeight;
let tY = se.scrollTop, gliding = false, lastT = 0;
function glide() {

addEventListener('wheel', e => {

addEventListener('scroll', () => { if (!gliding) tY = se.scrollTop; }, { passive: true });
