<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="assets/fonts/neuzeit.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
html { scroll-behavior: smooth; }
body { margin: 0; background: #FDFDFB; color: #141414; font-family: "Neuzeit Grotesk", "Helvetica Neue", Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #141414; text-decoration: none; }
a:hover { color: #6E6B66; }
::selection { background: #E9E6DF; }
p, h1, h2, h3, li { text-wrap: pretty; }
/* Header and footer grow with the viewport from 1280px (76px / 50px) to 1920px (86px / 64px) */
:root { --header-h: clamp(76px, 56px + 1.5625vw, 86px); --footer-h: clamp(50px, 22px + 2.1875vw, 64px); }
/* Side padding, shared by header, main and footer on every page: 24px phone, 48px tablet, 10% from 1024px up */
:root { --side-pad: 24px; }
@media (min-width: 768px) { :root { --side-pad: 48px; } }
@media (min-width: 1024px) { :root { --side-pad: 10vw; } }
html { scrollbar-gutter: stable; }
</style>
</helmet>

<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#FAF9F5"></rect><text x="50" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#141414">A&amp;E</text></svg></template>
<div style="min-height: 100vh; display: flex; flex-direction: column; position: relative">
<header style="border-bottom: 1px solid #E7E4DE; position: relative; z-index: 30; background: #FDFDFB" data-screen-label="Header">
  <div style="width: 100%; box-sizing: border-box; margin: 0 auto; padding: {{ mainPad }}; height: var(--header-h); display: flex; flex-wrap: wrap; align-content: center; align-items: {{ headerAlign }}; justify-content: space-between; gap: 32px">
    <a href="Home.dc.html" style="font-family: 'EB Garamond', serif; font-size: 29px; letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap">Arbor <span style="font-style: italic; text-transform: none; letter-spacing: 0">&amp;</span> Eye</a>
    <div style="display: flex; gap: 40px; align-items: {{ headerAlign }}">
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <nav style="display: flex; gap: 40px; font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase">
          <a href="Gallery.dc.html">Gallery</a>
          <a href="gallery-filmstrip.html">Gallery2</a>
          <a href="About.dc.html">About</a>
          <a href="Contact%20Page.dc.html">Contact</a>
        </nav>
      </sc-if>
      <div style="display: flex; gap: 20px; align-items: {{ headerAlign }}">
        <div style="display: {{ headerIconsDisplay }}; gap: 20px; align-items: {{ headerAlign }}">
        <a href="#" aria-label="Account" style="display: flex; color: #141414">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.5 20c1.4-3.2 4.2-5 7.5-5s6.1 1.8 7.5 5"></path></svg>
        </a>
        <a href="#" aria-label="Cart" style="display: flex; align-items: center; position: relative; color: #141414">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 7.5h15l-1.2 12.5H5.7L4.5 7.5Z"></path><path d="M8.5 10V6a3.5 3.5 0 0 1 7 0v4"></path></svg>
          <sc-if value="{{ showCartBadge }}" hint-placeholder-val="{{ true }}">
            <span style="position: absolute; top: -6px; right: -8px; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #141414; color: #FDFDFB; font-size: 9px">{{ cartCount }}</span>
          </sc-if>
        </a>
        </div>
        <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ toggleMenu }}" aria-label="Menu" style="border: none; background: transparent; padding: 8px 0 8px 8px; cursor: pointer; display: grid; gap: 5px">
            <span style="display: block; width: 20px; height: 1.5px; background: #141414; transition: transform 0.2s; transform: {{ barTop }}"></span>
            <span style="display: block; width: 20px; height: 1.5px; background: #141414; transition: opacity 0.2s; opacity: {{ barMid }}"></span>
            <span style="display: block; width: 20px; height: 1.5px; background: #141414; transition: transform 0.2s; transform: {{ barBot }}"></span>
          </button>
        </sc-if>
      </div>
    </div>
  </div>
</header>
<nav style="position: fixed; top: var(--header-h); bottom: var(--footer-h); left: 0; right: 0; z-index: 20; background: #FDFDFB; transform: {{ menuTransform }}; visibility: {{ menuVis }}; transition: transform 0.3s ease, visibility 0.3s; display: grid; align-content: start; padding: 8px 24px 20px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase" data-screen-label="Mobile menu">
  <a href="Gallery.dc.html" style="padding: 28px 0; border-bottom: 1px solid #F0EDE7">Gallery</a>
  <a href="gallery-filmstrip.html" style="padding: 28px 0; border-bottom: 1px solid #F0EDE7">Gallery2</a>
  <a href="About.dc.html" style="padding: 28px 0; border-bottom: 1px solid #F0EDE7">About</a>
  <a href="Contact%20Page.dc.html" style="padding: 28px 0; border-bottom: 1px solid #F0EDE7">Contact</a>
  <a href="Contact%20Page.dc.html#shipping" style="padding: 28px 0; border-bottom: 1px solid #F0EDE7">Shipping</a>
  <a href="Contact%20Page.dc.html#returns" style="padding: 28px 0">Returns &amp; Exchanges</a>
  <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
    <a href="#" style="padding: 28px 0; border-top: 1px solid #F0EDE7; display: flex; align-items: center; gap: 14px"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.5 20c1.4-3.2 4.2-5 7.5-5s6.1 1.8 7.5 5"></path></svg>Login/Account</a>
    <a href="#" style="padding: 28px 0; border-top: 1px solid #F0EDE7; display: flex; align-items: center; gap: 14px">
      <span style="position: relative; display: flex"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 7.5h15l-1.2 12.5H5.7L4.5 7.5Z"></path><path d="M8.5 10V6a3.5 3.5 0 0 1 7 0v4"></path></svg><span style="position: absolute; top: -6px; right: -8px; display: {{ badgeDisplay }}; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #141414; color: #FDFDFB; font-size: 9px">{{ cartCount }}</span></span>
      Shopping Cart
    </a>
  </sc-if>
</nav>

<main style="width: 100%; box-sizing: border-box; margin: 0 auto; padding: {{ mainPad }}; flex: 1; display: flex; flex-direction: column; justify-content: center" data-screen-label="Home — Gallery">
  <section style="padding: {{ heroPad }}; display: grid">
    <a href="{{ heroHref }}" style="display: block; width: {{ heroW }}; aspect-ratio: 1.494; margin: 0 auto; min-width: 0; position: relative; background: url(uploads/arbor-mark.png) center / auto 78% no-repeat">
      {{ heroImg }}
      <img src="uploads/intro-logo.png" alt="" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 72%; max-width: 900px; opacity: {{ introOpacity }}; transition: opacity 0.9s ease; pointer-events: none">
    </a>
    <div onTouchStart="{{ swipeStart }}" onTouchEnd="{{ swipeEnd }}" style="position: relative; margin-top: {{ railMargin }}; display: flex; align-items: {{ railAlign }}; justify-content: {{ railJustify }}; gap: {{ railGap }}; touch-action: pan-y">
      <button onClick="{{ prev }}" aria-label="Previous artwork" style="border: none; background: transparent; cursor: pointer; padding: 8px 8px {{ arrowPadBottom }} 0; margin-left: -2px; color: #ADA9A2; display: flex" style-hover="color: #6E6B66">
        <svg width="13" height="36" viewBox="0 0 22 60" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="21 1 1 30.66 21 59"></polyline></svg>
      </button>
      <div style="clip-path: {{ railClip }}; width: {{ railWidth }}; padding: 10px 0; flex: none">
        <div onMouseMove="{{ dockMove }}" onMouseLeave="{{ dockLeave }}" style="display: flex; gap: 22px; align-items: flex-end; width: max-content; will-change: transform; transform: {{ railShift }}; transition: {{ railTransition }}">
          <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="9">
            <button onClick="{{ t.select }}" aria-label="{{ t.alt }}" style="border: 1.5px solid {{ t.borderColor }}; background: #FFFFFF; padding: 3px; cursor: pointer; flex: none; opacity: {{ t.opacity }}; visibility: {{ t.vis }}; display: block; position: relative; transform-origin: center bottom; transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease, border-color 0.35s ease" style-hover="opacity: 1">
              {{ t.img }}
            </button>
          </sc-for>
        </div>
      </div>
      <button onClick="{{ next }}" aria-label="Next artwork" style="border: none; background: transparent; cursor: pointer; padding: 8px 8px {{ arrowPadBottom }} 8px; color: #ADA9A2; display: flex" style-hover="color: #6E6B66">
        <svg width="13" height="36" viewBox="0 0 22 60" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="1 1 21 30.66 1 59"></polyline></svg>
      </button>
      <p style="position: absolute; top: 100%; left: 0; right: 0; margin: 10px 0 0; text-align: center; font-style: italic; font-size: 17px; font-weight: 300; letter-spacing: 0.04em; color: #8A8680; pointer-events: none">{{ hoverTitle }}</p>
    </div>
  </section>
</main>

<footer style="position: {{ footerPos }}; left: 0; right: 0; bottom: 0; z-index: 20; border-top: 1px solid #E7E4DE; background: #FAF9F5; height: var(--footer-h); box-sizing: border-box; margin-top: auto" data-screen-label="Footer">
  <div style="width: 100%; height: 100%; box-sizing: border-box; margin: 0 auto; padding: {{ mainPad }}; display: flex; align-items: center; justify-content: space-between; gap: 24px; font-size: 12px; color: #0F0F0F">
    <p style="margin: 0">Copyright © 2026 Arbor &amp; Eye</p>
    <div style="display: flex; gap: 16px; align-items: center">
      <a href="https://www.instagram.com/arbor.eye/" target="_blank" rel="noopener" aria-label="Instagram" style="display: flex; opacity: 0.85" style-hover="opacity: 1">
        <img src="uploads/social_IG.png" alt="Instagram" style="display: block; width: 27.5px; height: 27.5px">
      </a>
      <a href="#" aria-label="Pinterest" style="display: flex; opacity: 0.85" style-hover="opacity: 1">
        <img src="uploads/social_pinterest.png" alt="Pinterest" style="display: block; width: 27.5px; height: 27.5px">
      </a>
    </div>
  </div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;autoplay&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Carousel&quot;},
  &quot;cartCount&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 1, &quot;min&quot;: 0, &quot;max&quot;: 9, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Header&quot;}
}">
class Component extends DCLogic {
  state = { mobile: typeof window !== 'undefined' && window.innerWidth < 768, tablet: typeof window !== 'undefined' && window.innerWidth < 1280, menuOpen: false, index: 0, hover: false, fade: false, ratio: 1.494, railBase: 0, animate: false, intro: true }; // ratio: the scans' proportion; the hero frame keeps it for every work
  // The carousel shows the uncropped gallery scans (paper border included). `cropped` keeps the original
  // cropped file for each piece in case it is wanted again. Titles must match the Gallery entries exactly.
  arts = [
    { src: 'assets/works/DSC01769.jpg', title: 'Brilliance', alt: 'Brilliance' }, // first, per Ned
    { src: 'assets/works/CORE_12.jpg', cropped: 'assets/art-1.png', title: 'Symbiosis', alt: 'Green field with red, ochre and white forms' },
    { src: 'assets/works/CORE_20.jpg', cropped: 'assets/art-2.png', title: 'Core 20', alt: 'Chartreuse field with blue-ringed forms' },
    { src: 'assets/works/CORE_11.jpg', cropped: 'assets/art-3.png', title: 'Script', alt: 'Red, black and yellow strokes on white' },
    { src: 'assets/works/CORE_14.jpg', cropped: 'assets/art-4.png', title: 'Articulation', alt: 'Color band study on textured paper', hidden: true }, // Ned does not want it shown
    { src: 'assets/works/CORE_16.jpg', cropped: 'assets/art-5.png', title: 'Habitat', alt: 'Sunset watercolor with green sprigs' },
    { src: 'assets/works/CORE_15.jpg', cropped: 'assets/art-6.png', title: 'Chamber', alt: 'Two framed panels on black ground' },
    { src: 'assets/works/CORE_17.jpg', cropped: 'assets/art-7.png', title: 'Core 17', alt: 'Ochre field with green and blue frames' },
    { src: 'assets/works/CORE_13.jpg', title: 'Conduit', alt: 'Conduit' },
    { src: 'assets/works/CORE_18.jpg', title: 'Upwelling', alt: 'Upwelling' }
  ].filter(a => !a.hidden);
  go(d) { this.show((this.state.index + d + this.arts.length) % this.arts.length); }
  // Dock-style magnification: the thumbnail under the cursor grows most, neighbours less (bell curve), all anchored
  // at their bottom edge and nudged sideways so they never overlap. Styles are set directly for smooth tracking.
  dockBase(strip) {
    this.dock = Array.from(strip.children).map(b => { const r = b.getBoundingClientRect(); return { cx: r.left + r.width / 2, w: r.width }; });
  }
  dockMove(e) {
    const strip = e.currentTarget; const btns = Array.from(strip.children);
    if (!this.dock || this.dock.length !== btns.length) this.dockBase(strip);
    const base = this.dock; const slot = base.length > 1 ? base[1].cx - base[0].cx : 100;
    const scales = base.map(b => 1 + 0.3 * Math.exp(-Math.pow((e.clientX - b.cx) / (1.15 * slot), 2)));
    const extra = scales.map((sc, k) => (sc - 1) * base[k].w);
    const total = extra.reduce((a, b) => a + b, 0);
    let acc = 0;
    btns.forEach((btn, k) => {
      const shift = acc + extra[k] / 2 - total / 2; acc += extra[k];
      btn.style.transition = 'transform 0.14s ease-out, opacity 0.35s ease, border-color 0.35s ease';
      btn.style.transform = 'translateX(' + shift.toFixed(1) + 'px) scale(' + scales[k].toFixed(3) + ')';
      btn.style.zIndex = String(Math.round(scales[k] * 100));
    });
  }
  dockLeave(e) {
    Array.from(e.currentTarget.children).forEach(btn => {
      btn.style.transition = 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease, border-color 0.35s ease';
      btn.style.transform = ''; btn.style.zIndex = '';
    });
    this.dock = null;
  }
  // finger swipe on the image or thumbnails: left = next, right = previous
  touchStart(e) { this.touchX = e.touches[0].clientX; }
  touchEnd(e) { const dx = e.changedTouches[0].clientX - this.touchX; if (Math.abs(dx) > 40) this.go(dx < 0 ? 1 : -1); }
  // The thumbnail tray keeps one extra thumbnail waiting off-stage on each side. Selecting a work slides the
  // whole strip by the slots travelled (0.65s ease), then re-centres it on the new work without a visible change.
  show(k) {
    if (k === this.state.index || this.state.fade || this.state.animate) return;
    this.setState({ fade: true });
    setTimeout(() => {
      this.setState({ index: k, fade: false, animate: true });
      setTimeout(() => this.setState({ railBase: k, animate: false }), 700);
    }, 400);
  }
  // Fallback if an artwork file is missing: a light green box.
  ph(k) { return e => { e.currentTarget.src = 'assets/placeholder-landscape.svg'; }; }
  // Open menu: page scroll locked at the top, menu fixed below the header, footer pinned to the bottom of the screen
  setMenu(open) {
    document.body.style.overflow = open ? 'hidden' : '';
    if (open) window.scrollTo({ top: 0, behavior: 'instant' });
    this.setState({ menuOpen: open });
  }
  componentDidMount() {
    this.arts.forEach(a => { const im = new Image(); im.src = a.src; }); // preload so swaps are instant
    this.introTimer = setTimeout(() => this.setState({ intro: false }), 3000); // wordmark overlay fades off after 3s
    this.mq = window.matchMedia('(max-width: 767px)');
    this.onMq = () => { document.body.style.overflow = ''; this.setState({ mobile: this.mq.matches, menuOpen: false }); };
    this.mq.addEventListener('change', this.onMq);
    this.setState({ mobile: this.mq.matches });
    this.mqTablet = window.matchMedia('(max-width: 1279px)');
    this.onMqTablet = () => this.setState({ tablet: this.mqTablet.matches });
    this.mqTablet.addEventListener('change', this.onMqTablet);
    this.setState({ tablet: this.mqTablet.matches });
    this.onKey = (e) => { if (e.key === 'ArrowLeft') this.go(-1); if (e.key === 'ArrowRight') this.go(1); };
    window.addEventListener('keydown', this.onKey);
    this.timer = setInterval(() => { if (this.props.autoplay) this.go(1); }, 5000);
  }
  componentWillUnmount() {
    if (this.mq) this.mq.removeEventListener('change', this.onMq); if (this.mqTablet) this.mqTablet.removeEventListener('change', this.onMqTablet);
    window.removeEventListener('keydown', this.onKey);
    clearInterval(this.timer);
    clearTimeout(this.introTimer);
  }
  renderVals() {
    const cartCount = this.props.cartCount ?? 1;
    const m = this.state.mobile;
    const i = this.state.index;
    const n = this.arts.length;
    // Desktop: the image fits the height between header and footer (61px = header border + hero padding; the thumbnail
    // rail adds 4.5% of the image width) and never exceeds the content width; thumbnails scale with the image.
    // rail = thumbnail + 29px of padding/border; 30% of it overlaps the image, so 70% (0.0385 x width + 20px) sits below
    const k = this.state.ratio / (1 + 0.0385 * this.state.ratio);
    const fitW = 'calc((100vh - var(--header-h) - var(--footer-h) - 81px) * ' + k.toFixed(4) + ')';
    const smallFit = 'calc((100vh - var(--header-h) - var(--footer-h) - ' + (m ? 166 : 138) + 'px) * ' + this.state.ratio.toFixed(4) + ')';
    const heroW = (m || this.state.tablet) ? 'min(100%, ' + smallFit + ')' : 'min(100%, ' + fitW + ')';
    const thumbH = m ? '44px' : this.state.tablet ? '52px' : 'calc(min(100vw - 2 * var(--side-pad), ' + fitW + ') * 0.055)';
    const half = m ? 1 : this.state.tablet ? 2 : 3; // 3 / 5 / 7 thumbnails visible, centred on the current work
    const base = this.state.railBase;
    const shown = Array.from({ length: 2 * half + 3 }, (_, j) => (base + j - half - 1 + n) % n); // one extra each side, off-stage
    let shift = (i - base + n) % n; if (shift > n / 2) shift -= n; // signed slots between the strip's centre and the selected work
    const slot = 'calc((' + thumbH + ') * 1.494 + 9px + 22px)'; // scans are 1.494:1; 9px = padding + border; 22px gap
    return {
      cartCount,
      showCartBadge: cartCount > 0,
      isMobile: m,
      headerAlign: m ? 'center' : 'baseline', // phones have no nav text to align to
      isDesktop: !m,
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setMenu(!this.state.menuOpen),
      footerPos: this.state.menuOpen ? 'fixed' : 'static',
      barTop: this.state.menuOpen ? 'translateY(6.5px) rotate(45deg)' : 'none',
      barMid: this.state.menuOpen ? 0 : 1,
      barBot: this.state.menuOpen ? 'translateY(-6.5px) rotate(-45deg)' : 'none',
      menuTransform: this.state.menuOpen ? 'translateY(0)' : 'translateY(-100%)',
      menuVis: this.state.menuOpen ? 'visible' : 'hidden',
      narrow: m, // whenever the hamburger shows, the account and cart icons move into the menu
      headerIconsDisplay: m ? 'none' : 'flex',
      badgeDisplay: cartCount > 0 ? 'inline-flex' : 'none',
      closeMenu: () => this.setMenu(false),
      mainPad: '0 var(--side-pad)',
      heroPad: m ? '32px 0' : this.state.tablet ? '40px 0' : '28px 0 32px',
      railMargin: m ? '28px' : 'calc(-0.3 * (' + thumbH + ' + 29px))',
      railAlign: m ? 'center' : 'flex-end', // phones (no overlap): arrows centred on the thumbnails; otherwise on their baseline
      arrowPadBottom: m ? '8px' : '15px', // tray padding (10px) + thumbnail padding/border (4.5px) puts the chevron on the thumbnail baseline
      railJustify: 'center',
      imgW: m ? 'auto' : '100%',
      imgMaxH: m ? '100%' : 'none',
      railGap: m ? '4px' : this.state.tablet ? '40px' : '56px',
      thumbH,
      heroImg: React.createElement('img', { src: this.arts[i].src, alt: this.arts[i].alt, onError: this.ph(i), onTouchStart: e => this.touchStart(e), onTouchEnd: e => this.touchEnd(e), onMouseEnter: () => this.setState({ hover: true }), onMouseLeave: () => this.setState({ hover: false }), style: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', display: 'block', touchAction: 'pan-y', boxShadow: '0 6px 16px rgba(20,20,20,0.14)', opacity: this.state.fade ? 0 : 1, transition: 'opacity 0.4s ease' } }),
      heroW,
      heroHref: 'Gallery.dc.html#' + encodeURIComponent(this.arts[i].title),
      introOpacity: this.state.intro ? 1 : 0,
      hoverTitle: this.state.hover ? this.arts[i].title : '',
      prev: () => this.go(-1),
      // one slot = thumbnail width (about 1.5 x its height) + padding/border + gap
      railWidth: 'calc(' + (2 * half + 1) + ' * ' + slot + ' - 22px)',
      railShift: 'translateX(calc(' + (-(1 + shift)) + ' * ' + slot + '))',
      railTransition: this.state.animate ? 'transform 0.65s cubic-bezier(0.45, 0, 0.15, 1)' : 'none',
      railClip: this.state.animate ? 'inset(-120px 0 -20px 0)' : 'inset(-120px -60px -20px -60px)',
      dockMove: (e) => this.dockMove(e),
      dockLeave: (e) => this.dockLeave(e),
      swipeStart: (e) => this.touchStart(e),
      swipeEnd: (e) => this.touchEnd(e),
      next: () => this.go(1),
      thumbs: shown.map((k, j) => ({
        vis: (j === 0 || j === shown.length - 1) && !this.state.animate ? 'hidden' : 'visible',
        img: React.createElement('img', { src: this.arts[k].src, alt: '', onError: this.ph(k), style: { display: 'block', height: thumbH, width: 'auto' } }),
        alt: 'Show ' + this.arts[k].alt,
        borderColor: k === i ? '#141414' : '#E7E4DE',
        opacity: k === i ? 1 : 0.75,
        select: () => this.show(k)
      }))
    };
  }
}
</script>
</body>
</html>
