<style>
/* screens over 2000px wide: every font size 25% larger (since 2026-10-19; each font-size is multiplied by --fs; the
   logo's hidden text and H0's hover title are left out) */
:root { --fs: 1; }
@media (min-width: 2001px) { :root { --fs: 1.25; } }

html { scroll-behavior: smooth; }
body { margin: 0; background: #FDFDFB; color: #141414; font-family: "Neuzeit Grotesk", "Helvetica Neue", Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #141414; text-decoration: none; }
a:hover { color: #6E6B66; }
::selection { background: #E9E6DF; }
p, h1, h2, h3, li { text-wrap: pretty; }
/* Header and footer grow with the viewport from 1280px (72px / 43px) to 1920px (80px / 54px) */
:root { --header-h: clamp(72px, 57px + 1.172vw, 80px); --footer-h: clamp(43px, 19px + 1.859vw, 54px); }
/* Side padding, shared by header, main and footer on every page: 24px phone, 48px tablet, 10% from 1024px up */
:root { --side-pad: 24px; }
@media (min-width: 768px) { :root { --side-pad: 48px; } }
@media (min-width: 1024px) { :root { --side-pad: 10vw; } }
html { scrollbar-gutter: stable; }
/* TEMP: while G5 / G6 / G7 are in the nav, tighten it at tablet widths so the header stays on one line */
@media (min-width: 768px) and (max-width: 1919px) { header nav { gap: 16px !important; font-size: calc(12px * var(--fs)) !important; letter-spacing: 0.08em !important; } }
@media (min-width: 768px) and (max-width: 899px) { header nav { gap: 9px !important; font-size: calc(11px * var(--fs)) !important; letter-spacing: 0.03em !important; } }
/* Phones in portrait: footer twice as tall */
@media (max-width: 767px) and (orientation: portrait) { :root { --footer-h: 86px; } }
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props="{
  &quot;autoplay&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Carousel&quot;},
  &quot;cartCount&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 0, &quot;min&quot;: 0, &quot;max&quot;: 9, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Header&quot;}
}">
class Component extends DCLogic {
  state = { mobile: typeof window !== 'undefined' && window.innerWidth < 768, tablet: typeof window !== 'undefined' && window.innerWidth < 1280, menuOpen: false, index: 0, hover: false, fade: false, ratio: 1.5, railBase: 0, animate: false, intro: 'pre', heroOk: null, heroBad: null };   // heroOk / heroBad: the main image's src once it has loaded / failed // ratio: the scans' proportion; the hero frame keeps it for every work
  // The carousel shows the uncropped gallery scans (paper border included). `cropped` keeps the original
  // cropped file for each piece in case it is wanted again. Titles must match the Gallery entries exactly.
  arts = [
    { src: 'assets/works/select_brilliance.jpg', fit: [0.118, 0.878, 0.170, 0.830], title: 'Brilliance', tag: 'Light reveals what was always there.', alt: 'Brilliance: Light reveals what was always there.' }, // first, per Ned
    { src: 'assets/works/core_symbiosis.jpg', fit: [0.120, 0.883, 0.188, 0.818], cropped: 'assets/art-1.png', title: 'Symbiosis', tag: 'Distinct forms exist through mutual relationships.', alt: 'Symbiosis: Distinct forms exist through mutual relationships.' },
    { src: 'assets/works/core_emergence-no-dedication.jpg', fit: [0.117, 0.882, 0.172, 0.828], cropped: 'assets/art-2.png', title: 'Emergence', tag: 'Variation gives rise to complexity.', alt: 'Emergence: Variation gives rise to complexity.' },
    { src: 'assets/works/core_script.jpg', fit: [0.118, 0.882, 0.177, 0.828], cropped: 'assets/art-3.png', title: 'Script', tag: 'Repeated strokes form a visual language.', alt: 'Script: Repeated strokes form a visual language.' },
    { src: 'assets/works/core_articulation.jpg', fit: [0.165, 0.800, 0.323, 0.632], cropped: 'assets/art-4.png', title: 'Articulation', tag: 'Individual forms define a shared rhythm.', alt: 'Articulation: Individual forms define a shared rhythm.', hidden: true }, // Ned does not want it shown
    { src: 'assets/works/core_habitat.jpg', fit: [0.122, 0.882, 0.177, 0.823], cropped: 'assets/art-5.png', title: 'Habitat', tag: 'Living forms establish a shared environment.', alt: 'Habitat: Living forms establish a shared environment.' },
    { src: 'assets/works/core_chamber.jpg', fit: [0.122, 0.877, 0.185, 0.823], cropped: 'assets/art-6.png', title: 'Chamber', tag: 'Defined spaces establish internal relationships.', alt: 'Chamber: Defined spaces establish internal relationships.' },
    { src: 'assets/works/core_affinity.jpg', fit: [0.117, 0.880, 0.175, 0.833], cropped: 'assets/art-7.png', title: 'Affinity', tag: 'Related forms create a unified field.', alt: 'Affinity: Related forms create a unified field.' },
    { src: 'assets/works/core_conduit.jpg', fit: [0.108, 0.892, 0.163, 0.823], title: 'Conduit', tag: 'Pathways connect a shared structure.', alt: 'Conduit: Pathways connect a shared structure.' },
    { src: 'assets/works/core_upwelling.jpg', paint: [0.075, 0.927, 0.090, 0.910], title: 'Upwelling', tag: 'Parallel forms organize a living field.', alt: 'Upwelling: Parallel forms organize a living field.' }
  ].filter(a => !a.hidden);
  go(d) { this.show((this.state.index + d + this.arts.length) % this.arts.length); }
  // Dock-style magnification, the "genie": the thumbnail under the cursor grows most (130%), neighbours less
  // (bell curve), each growing evenly from its own centre and nudged sideways so they never overlap; it tracks the cursor.
  dockBase(strip) {
    this.dock = Array.from(strip.children).map(b => { const r = b.getBoundingClientRect(); return { cx: r.left + r.width / 2, w: r.width }; });
  }
  dockMove(e) {
    if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;   // mouse only: a tap must not leave thumbnails magnified
    this.dockStrip = e.currentTarget; this.dockX = e.clientX;
    if (this.state.animate) return;   // not while the tray glides
    const strip = e.currentTarget; const btns = Array.from(strip.children);
    if (!this.dock || this.dock.length !== btns.length) this.dockBase(strip);
    const base = this.dock; const slot = base.length > 1 ? base[1].cx - base[0].cx : 100;
    const scales = base.map(b => 1 + 0.3 * Math.exp(-Math.pow((e.clientX - b.cx) / (1.15 * slot), 2)));
    const extra = scales.map((sc, k) => (sc - 1) * base[k].w);
    const total = extra.reduce((a, b) => a + b, 0);
    let acc = 0;
    btns.forEach((btn, k) => {
      const shift = acc + extra[k] / 2 - total / 2; acc += extra[k];
      btn.style.transition = 'transform 0.14s ease-out, opacity 0.35s ease, border-color 0.35s ease';
      btn.style.transformOrigin = 'center center';
      btn.style.transform = 'translateX(' + shift.toFixed(1) + 'px) scale(' + scales[k].toFixed(3) + ')';
      btn.style.zIndex = String(Math.round(scales[k] * 100));
    });
  }
  // the magnification put down at once (before a glide), and taken up again from the cursor's last place once the tray settles
  relaxDock() {
    if (this.dockStrip) Array.from(this.dockStrip.children).forEach(btn => { btn.style.transition = 'none'; btn.style.transform = ''; btn.style.zIndex = ''; });
    this.dock = null;
  }
  redock() {
    this.relaxDock();
    if (this.dockStrip && this.dockX != null) { void this.dockStrip.offsetWidth; this.dockMove({ currentTarget: this.dockStrip, clientX: this.dockX }); }
  }
  dockLeave(e) {
    this.dockX = null;
    Array.from(e.currentTarget.children).forEach(btn => {
      btn.style.transition = 'transform 0.7s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.35s ease, border-color 0.35s ease';   // settles back as softly
      btn.style.transform = ''; btn.style.zIndex = '';
    });
