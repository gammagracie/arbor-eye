<style>
/* Shared site tokens: header/footer heights and side padding match the other pages */
:root { --header-h: clamp(72px, 57px + 1.172vw, 80px); --footer-h: clamp(43px, 19px + 1.859vw, 54px); --side-pad: 24px; --thumb-h: 25px; --step-w: clamp(32px, 5.8vw, 84px); }
@media (min-width: 768px) { :root { --thumb-h: 30px; } }
@media (min-width: 768px) { :root { --side-pad: 48px; } }
@media (min-width: 1024px) { :root { --side-pad: 10vw; } }
html, body { height: 100%; margin: 0; }
body { background: #FDFDFB; color: #141414; font-family: "Neuzeit Grotesk", "Helvetica Neue", Helvetica, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: #141414; text-decoration: none; }
a:hover { color: #6E6B66; }
button { font-family: inherit; }
::selection { background: #E9E6DF; }

/* header + work + thumbnails fill the screen exactly; the footer sits below the fold and is reached by scrolling */
.page { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
/* Phones in portrait: footer twice as tall and kept on screen (header, work and filmstrip share the rest of the height) */
@media (max-width: 767px) and (orientation: portrait) { :root { --footer-h: 86px; } .page { height: calc(100vh - var(--footer-h)); height: calc(100dvh - var(--footer-h)); } }

/* header */
header { flex: none; border-bottom: 1px solid #E7E4DE; background: #FDFDFB; position: relative; z-index: 30; }
.bar { height: var(--header-h); box-sizing: border-box; padding: 0 var(--side-pad); display: flex; flex-wrap: wrap; align-content: center; align-items: baseline; justify-content: space-between; gap: 32px; }
.logo { position: relative; display: block; width: 188.2px; overflow: visible; font-family: 'EB Garamond', serif; font-size: 29px; letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap; }
.logo .logo-text { visibility: hidden; }
.logo .logo-text span { font-style: italic; text-transform: none; letter-spacing: 0; }
.right, .icons { display: flex; align-items: baseline; }
.right { gap: 40px; } .icons { gap: 20px; }
nav.main { display: flex; gap: 40px; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; }
nav.main .on { font-weight: 600; }
.icons a { display: flex; position: relative; }
.badge { position: absolute; top: -6px; right: -8px; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #141414; color: #FDFDFB; font-size: 9px; }
.burger { display: none; border: none; background: transparent; padding: 8px 0 8px 8px; cursor: pointer; gap: 5px; }
.burger span { display: block; width: 20px; height: 1.5px; background: #141414; transition: transform 0.2s, opacity 0.2s; }
body.menu-open .burger span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
body.menu-open .burger span:nth-child(2) { opacity: 0; }
body.menu-open .burger span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
.menu { position: fixed; top: var(--header-h); bottom: 0; left: 0; right: 0; z-index: 20; background: #FDFDFB; display: grid; align-content: start; padding: 8px 24px 20px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; transform: translateY(-100%); visibility: hidden; transition: transform 0.3s ease, visibility 0.3s; }
body.menu-open .menu { transform: translateY(0); visibility: visible; }
.menu a { padding: 28px 0; border-bottom: 1px solid #F0EDE7; display: flex; align-items: center; gap: 14px; }
.menu a:last-child { border-bottom: none; }
@media (max-width: 767px) {
  .bar { align-items: center; }
  nav.main, .icons a { display: none; }
  .burger { display: grid; }
}

/* stage: the selected work, as large as the space allows */
/* the work may grow past the page's side padding (out to 3% of the screen) so it is as large as the window allows */
/* view switch (top left, lined up with the logo like the grid gallery's switcher): 1 work, 3 in a row, or 9 in three rows of three; phones are always one-up */
.tools { flex: none; display: flex; justify-content: flex-start; align-items: center; gap: 14px; padding: 14px var(--side-pad) 0; position: relative; z-index: 6; }
/* filter menus (top right, on the bag icon's line, as on the grid gallery): Series and Year */
.filters { margin-left: auto; display: flex; gap: 48px; }
/* 9-up, where the grid needs the room: the two menus stack at the top right, on the bag icon's line (out of the flow, so the toolbar keeps its height) */
.filters.stacked { position: absolute; right: var(--side-pad); top: 14px; flex-direction: column; align-items: flex-end; gap: 10px; }
.filter-menu { position: relative; }
.fm-btn { display: flex; align-items: center; gap: 8px; border: none; background: transparent; padding: 0 0 5px; font-family: inherit; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #141414; cursor: pointer; }
.fm-list { position: absolute; top: 100%; right: 0; z-index: 25; width: 240px; margin-top: 6px; background: #FDFDFB; border-top: 1.5px solid #141414; box-shadow: 0 14px 36px rgba(20,20,20,0.12); padding: 14px 0 12px; display: none; }
.filter-menu.open .fm-list { display: grid; }
.fm-list button { text-align: left; border: none; background: transparent; padding: 11px 32px; font-family: inherit; font-size: 14px; font-weight: 300; letter-spacing: 0.08em; color: #141414; cursor: pointer; white-space: nowrap; }
.fm-list button:hover { color: #6E6B66; } .fm-list button.on { color: #8A867E; }
.fm-list .fm-note { padding: 8px 32px 2px; font-size: 11px; letter-spacing: 0.1em; color: #ADA9A2; }
@media (max-width: 767px) { .tools { display: none; } }
.count { border: none; background: transparent; padding: 2px; cursor: pointer; display: flex; color: #C9C5BD; transition: color 0.2s ease; }
.count:hover { color: #6E6B66; } .count.on { color: #141414; }
.count svg { width: 17px; height: 17px; fill: currentColor; display: block; }
.stage { flex: 1; min-height: 0; position: relative; margin: 10px var(--side-pad) 0; overflow: hidden; }
@media (min-width: 768px) { .stage { margin: 10px max(24px, 3vw) 0; } }
/* the arrows, locked in every view from the first paint: the left chevron's point on the logo's left edge, the right one's on
   the bag icon's right edge (side padding, less the stage's margin, less the point's 1/22 of the chevron's width) */
@media (min-width: 768px) {
  .step.prev { left: calc(var(--side-pad) - max(24px, 3vw) - clamp(15px, 2.025vw, 29.25px) / 22); }
  .step.next { right: calc(var(--side-pad) - max(24px, 3vw) - clamp(15px, 2.025vw, 29.25px) / 22); }
}
/* the featured works sit in a centred row, all the same height, a gap apart */
.row { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 28px; }
.row.grid { display: grid; grid-template-columns: repeat(3, auto); justify-items: center; align-items: center; row-gap: 48px; column-gap: 60px; }   /* 9-up: three columns 60px apart, rows 48px apart, room under each work for its title */
.row.grid .art img { object-fit: contain; }   /* 9-up: every landscape shares one 3:2 box so the columns line up; a scan not exactly 3:2 is fitted inside it, never trimmed */
.art { position: relative; flex: none; display: block; box-shadow: 0 6px 16px rgba(20,20,20,0.14); cursor: pointer; transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
html:not(.touch) .art:hover { transform: scale(1.03); z-index: 2; }   /* hover: a subtle centre-out enlargement */
.art img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 0.9s ease-in-out; -webkit-user-drag: none; user-select: none; }
.stage { touch-action: pan-y; }
.art img.on { opacity: 1; }
/* previous / next chevrons either side of the work (placed by fit()) */
.step { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; transition: left 0.95s cubic-bezier(0.6, 0, 0.2, 1), right 0.95s cubic-bezier(0.6, 0, 0.2, 1); width: var(--step-w); height: 150px; padding: 0; border: none; background: transparent; color: #ADA9A2; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color 0.2s ease; }
.step:hover { color: #6E6B66; }
.step.prev { justify-content: flex-start; } .step.next { justify-content: flex-end; }
.step svg { width: clamp(15px, 2.025vw, 29.25px); height: auto; }   /* 75% of the earlier size: 29 x 81px on a 1440px screen, scaling down with the viewport to 15 x 42px */
.caption { flex: none; height: clamp(34px, calc(2.38vw + 10.2px), 57.8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: 'EB Garamond', serif; font-size: clamp(16px, calc(1.12vw + 4.8px), 27.2px); font-style: italic; letter-spacing: 0.1em; text-transform: uppercase; color: #141414; opacity: 0; transition: opacity 0.35s ease; }
.caption small { font-family: "Neuzeit Grotesk", "Helvetica Neue", Helvetica, sans-serif; font-style: normal; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #ADA9A2; }
.page.hovering .caption { opacity: 1; }
.page.multi .caption { transition: none; }
/* one-up on screens 1760-3300px wide: the hover title 3px larger */
@media (min-width: 1760px) and (max-width: 3300px) { .page:not(.multi) .caption { font-size: calc(clamp(16px, calc(1.12vw + 4.8px), 27.2px) + 3px); } }   /* 3 and 9 views: the title never slides or fades between works; it simply shows under the work the cursor is on */
html.touch .caption { opacity: 1; }
/* touch screens: title and arrows are hidden while anything moves (slides, crossfades, swipes, the strip, page scrolling) */
html.touch .page.moving .caption, html.touch .page.moving .step { opacity: 0; transition: opacity 0.15s ease; }

/* filmstrip: every work in one row, anchored above the footer. The row is a track moved by transform (fluid,
   eased) and thumbnails magnify under the cursor or finger; the wrap's top padding is headroom for them. */
.strip-wrap { flex: none; position: relative; z-index: 5; margin-top: -120px; padding: 120px 0 14px; pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--side-pad), #000 calc(100% - var(--side-pad)), transparent);
          mask-image: linear-gradient(90deg, transparent, #000 var(--side-pad), #000 calc(100% - var(--side-pad)), transparent); }
.strip { overflow: visible; padding: 6px 0; }
.track { display: flex; gap: 6px; align-items: flex-end; width: max-content; padding: 0 var(--side-pad); will-change: transform; pointer-events: auto; }
.thumb { flex: none; height: var(--thumb-h); padding: 0; border: none; background: none; cursor: pointer; position: relative; transform-origin: center bottom; transition: transform 0.16s ease-out, opacity 0.3s ease; }
.thumb img { display: block; height: var(--thumb-h); width: auto; box-shadow: 0 2px 8px rgba(20,20,20,0.12); transition: box-shadow 0.35s ease; }
.thumb.on img { box-shadow: 0 4px 12px rgba(20,20,20,0.38); }   /* the works featured in the main area: a deeper shadow */
html.touch .track { touch-action: none; }

/* footer */
footer { flex: none; height: var(--footer-h); box-sizing: border-box; border-top: 1px solid #E7E4DE; background: #FAF9F5; position: relative; z-index: 25; }
.foot { height: 100%; box-sizing: border-box; padding: 0 var(--side-pad); display: flex; align-items: center; justify-content: space-between; gap: 24px; font-size: 12px; color: #0F0F0F; }
.foot p { margin: 0; }
.social { display: flex; gap: 16px; align-items: center; }
.social a { display: flex; opacity: 0.85; } .social a:hover { opacity: 1; }
.social img { display: block; width: 27.5px; height: 27.5px; }
/* TEMP: while G5 / G6 / G7 are in the nav, tighten it at tablet widths so the header stays on one line */
@media (min-width: 768px) and (max-width: 1439px) { header nav { gap: 16px !important; font-size: 12px !important; letter-spacing: 0.08em !important; } }
@media (min-width: 768px) and (max-width: 899px) { header nav { gap: 9px !important; font-size: 11px !important; letter-spacing: 0.03em !important; } }
</style>

}
// the row only moves while the pointer is on the thumbnails: the row itself, or a magnified thumbnail rising above it
const inBand = (y, el) => { const band = track.getBoundingClientRect(); return (y >= band.top - 4 && y <= band.bottom + 4) || !!(el && el.closest && el.closest('.thumb')); };
let stillT = 0;
function follow(x) {
  mouseX = x;
  // the cursor steers only while it moves: once it rests on a thumbnail the row brakes to a stop, so the thumbnail can be clicked
  clearTimeout(stillT); stillT = setTimeout(() => { if (mouseX !== null) drive = 0; }, 120);
  const half = innerWidth / 2, dead = innerWidth * DEAD / 2, off = x - half;
  const reach = Math.min(1, (Math.abs(off) - dead) / (half - dead - Math.min(120, innerWidth * 0.08)));
  drive = Math.abs(off) <= dead ? 0 : Math.sign(off) * reach * reach * CRUISE / 1000;   // squared: slow near the still zone, full speed only at the edges
  cap = CRUISE / 1000;
  run();
}
function halt() { relax(); target = pos; vel = 0; }
// finger: the row glides and magnifies only while a finger is on the filmstrip, coasts to rest when it lifts,
// and a touch anywhere else on the page stops it dead
addEventListener('touchstart', e => {
  lastTouch = Date.now();
  document.documentElement.classList.add('touch');
  const t = e.touches[0];
  touching = inBand(t.clientY, e.target);
  if (touching) follow(t.clientX); else halt();
}, { passive: true, capture: true });
addEventListener('touchmove', e => { lastTouch = Date.now(); busy(600); if (touching) follow(e.touches[0].clientX); }, { passive: true });
['touchend', 'touchcancel'].forEach(n => addEventListener(n, () => { lastTouch = Date.now(); if (touching) { touching = false; relax(); } }, { passive: true }));
{
  addEventListener('mousemove', e => {
    if (Date.now() - lastTouch < 1200) return;   // mouse events synthesised from a tap
    document.documentElement.classList.remove('touch');
    if (!inBand(e.clientY, e.target)) { if (mouseX !== null) relax(); return; }
    follow(e.clientX);
  });
  document.addEventListener('mouseleave', () => { if (mouseX !== null) relax(); });
  strip.addEventListener('wheel', e => { e.preventDefault(); target = Math.max(0, Math.min(maxPan(), target + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY))); cap = Infinity; drive = null; run(); }, { passive: false });
}

// keyboard, resize
addEventListener('keydown', e => { if (e.key === 'ArrowRight') stepBy(1, 'y'); if (e.key === 'ArrowLeft') stepBy(-1, 'y'); });
addEventListener('resize', fit);
new ResizeObserver(fit).observe(stage);

$('prev').addEventListener('click', () => stepBy(-1, 'y'));
// scrolling up or down over the works moves through them like the arrows: down brings the next set up from below, up
// brings the previous set down from above. One set per gesture: after a step, further wheel events are ignored until the
// wheel has rested for 200ms (trackpad momentum included) and the slide has run its course.
let wheelAcc = 0, wheelLocked = false, wheelAt = 0, wheelQuiet;
stage.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  e.preventDefault();
  clearTimeout(wheelQuiet); wheelQuiet = setTimeout(() => { wheelLocked = false; wheelAcc = 0; }, 200);
  if (wheelLocked || performance.now() - wheelAt < 1300) return;
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) < 40) return;
  const d = wheelAcc > 0 ? 1 : -1; wheelAcc = 0;
  if (count > 1 && (d > 0 ? first + count >= WORKS.length : first <= 0)) return;   // wider windows stop at the ends
  wheelLocked = true; wheelAt = performance.now();
  stepBy(d, 'y');
}, { passive: false });
$('next').addEventListener('click', () => stepBy(1, 'y'));

// drag anywhere on the stage (mouse or finger), including the white space around the works: the row follows the
// pointer, and on release a pull of more than 40px slides on in that direction (pull right = right arrow); a short
// pull springs back. A click on a work still opens it unless it was dragged.
let drag = null, swallowClick = false;
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('.step')) return;
  drag = { id: e.pointerId, x: e.clientX, moved: false };
});
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 4 && !drag.moved) { drag.moved = true; stage.setPointerCapture(e.pointerId); }   // capture only once it is a drag: capturing on press would take the click away from the work's link
  if (drag.moved) busy(600);
  if (drag.moved) { row.style.transition = 'none'; row.style.transform = 'translate(-50%, -50%) translateX(' + dx + 'px)'; }
});
['pointerup', 'pointercancel'].forEach(n => stage.addEventListener(n, e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, d = drag; drag = null;
  if (!d.moved) return;
  swallowClick = true;
  if (Math.abs(dx) > 40 && (count === 1 || (dx > 0 ? first + count < WORKS.length : first > 0))) { row.style.transition = ''; row.style.transform = ''; stepBy(dx > 0 ? 1 : -1); }
  else { row.style.transition = 'transform 0.4s cubic-bezier(0.3, 0, 0.2, 1)'; row.style.transform = 'translate(-50%, -50%)'; setTimeout(() => { row.style.transition = ''; }, 450); }
}));
stage.addEventListener('click', e => { if (swallowClick) { e.preventDefault(); e.stopPropagation(); swallowClick = false; } }, true);

// mobile menu
$('burger').addEventListener('click', () => document.body.classList.toggle('menu-open'));

// ---- Filters: Series (each series, or horizontal / vertical works) and Year. Picking one narrows the featured window and
// the filmstrip to the matching works and starts again from the first of them. Years are read from each work's "y" when
// the list carries them (none yet).
const ALL = WORKS.slice();
let fSeries = 'All', fYear = 'All';
const SERIES_OPTS = [['All', 'All Series'], ['Ascent'], ['Convergence'], ['Core'], ['Outliers'], ['Select'], ['Spectrum'], ['Structure'], ['The Turning'], ['Tonal'], ['Horizontal'], ['Vertical']];
function yearOpts() { return [['All', 'All Years']].concat([...new Set(ALL.map(w => w.y).filter(Boolean))].sort((a, b) => b - a).map(y => [String(y)])); }
function applyFilter() {
  const list = ALL.filter(w => (fSeries === 'All' || w.s === fSeries || (fSeries === 'Horizontal' && w.r >= 1) || (fSeries === 'Vertical' && w.r < 1)) && (fYear === 'All' || String(w.y) === fYear));
  if (!list.length) return;
  WORKS.length = 0; WORKS.push(...list);
  buildStrip(); pos = target = vel = 0; track.style.transform = 'translate3d(0px,0,0)';
  first = current = 0; buildSlots(Math.min(count, WORKS.length)); setWindow(0, false);
}
function menu(id, label, opts, get, set) {
  const m = $(id), btn = m.querySelector('.fm-btn'), list = m.querySelector('.fm-list');
  const render = () => {
    btn.querySelector('span').textContent = get() === 'All' ? label : get();
    list.innerHTML = '';
    opts().forEach(([v, l]) => { const o = document.createElement('button'); o.setAttribute('role', 'option'); o.textContent = l || v; o.classList.toggle('on', get() === v); o.setAttribute('aria-selected', get() === v);
      o.addEventListener('click', e => { e.stopPropagation(); set(v); close(); render(); applyFilter(); }); list.appendChild(o); });
    if (id === 'fmYear' && opts().length === 1) { const n = document.createElement('p'); n.className = 'fm-note'; n.style.margin = '0'; n.textContent = 'Years to be added'; list.appendChild(n); }
  };
  btn.addEventListener('click', e => { e.stopPropagation(); const open = !m.classList.contains('open'); close(); m.classList.toggle('open', open); btn.setAttribute('aria-expanded', open); });
  render();
}
function close() { document.querySelectorAll('.filter-menu.open').forEach(x => { x.classList.remove('open'); x.querySelector('.fm-btn').setAttribute('aria-expanded', 'false'); }); }
menu('fmSeries', 'Series', () => SERIES_OPTS, () => fSeries, v => { fSeries = v; });
menu('fmYear', 'Year', yearOpts, () => fYear, v => { fYear = v; });
document.addEventListener('click', e => { if (!e.target.closest('.filter-menu')) close(); });
addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

// start on the work named in the URL, else the first work
const want = decodeURIComponent(location.hash.slice(1));
const start = WORKS.findIndex(w => w.f === want || w.t === want);
[...document.querySelectorAll('.count')].forEach(b => b.classList.toggle('on', +b.dataset.n === count));
buildSlots(Math.min(count, WORKS.length));
setWindow(start >= 0 ? start : 0, start > 0);
stripReady = true;
</script>
</body>
</html>
