<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

<style>
/* screens over 2000px wide: every font size 25% larger (since 2026-10-19; each font-size is multiplied by --fs; the
   logo's hidden text and H0's hover title are left out) */
:root { --fs: 1; }
@media (min-width: 2001px) { :root { --fs: 1.25; } }

/* Shared site tokens: header/footer heights and side padding match the other pages */
:root { --header-h: clamp(72px, 57px + 1.172vw, 80px); --footer-h: clamp(43px, 19px + 1.859vw, 54px); --side-pad: 24px; --thumb-h: 31.25px; --step-w: clamp(32px, 5.8vw, 84px); }
@media (min-width: 768px) { :root { --thumb-h: 37.5px; } }   /* filmstrip thumbnails 25% larger since 2026-10-21 (were 30px, 25px on phones) */
@media (min-width: 768px) { :root { --side-pad: 48px; } }
@media (min-width: 1024px) { :root { --side-pad: 10vw; } }
html, body { height: 100%; margin: 0; }
body { background: #FDFDFB; color: #141414; font-family: "Neuzeit Grotesk", "Helvetica Neue", Helvetica, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: #141414; text-decoration: none; }
a:hover { color: #6E6B66; }
button { font-family: inherit; }
::selection { background: #E9E6DF; }

/* header + work + thumbnails fill the screen exactly; the footer sits below the fold and is reached by scrolling */
.page { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
/* screens over 2000px (since 2026-10-21): the footer always on screen at the bottom and the page held still (nothing scrolls) */
@media (min-width: 2001px) { html, body { overflow: hidden; } .page { height: calc(100vh - var(--footer-h)); height: calc(100dvh - var(--footer-h)); } }
/* Phones in portrait: footer twice as tall and kept on screen (header, work and filmstrip share the rest of the height) */
@media (max-width: 767px) and (orientation: portrait) { :root { --footer-h: 86px; } .page { height: calc(100vh - var(--footer-h)); height: calc(100dvh - var(--footer-h)); } }

/* header */
header { flex: none; border-bottom: 1px solid #E7E4DE; background: #FDFDFB; position: relative; z-index: 30; }
.bar { height: var(--header-h); box-sizing: border-box; padding: 0 var(--side-pad); display: flex; flex-wrap: wrap; align-content: center; align-items: baseline; justify-content: space-between; gap: 32px; }
.logo { position: relative; display: block; width: 188.2px; overflow: visible; font-family: 'EB Garamond', serif; font-size: 29px; letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap; }
.logo .logo-text { visibility: hidden; }
.logo .logo-text span { font-style: italic; text-transform: none; letter-spacing: 0; }
.right, .icons { display: flex; align-items: baseline; }
.right { gap: 40px; } .icons { gap: 20px; }
nav.main { display: flex; gap: 40px; font-size: calc(13px * var(--fs)); letter-spacing: 0.18em; text-transform: uppercase; }
nav.main .on { font-weight: 600; }
.icons a { display: flex; position: relative; }
.badge { position: absolute; top: -6px; right: -8px; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #141414; color: #FDFDFB; font-size: calc(9px * var(--fs)); }
.burger { display: none; border: none; background: transparent; padding: 8px 0 8px 8px; cursor: pointer; gap: 5px; }
.burger span { display: block; width: 20px; height: 1.5px; background: #141414; transition: transform 0.2s, opacity 0.2s; }
body.menu-open .burger span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
body.menu-open .burger span:nth-child(2) { opacity: 0; }
body.menu-open .burger span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
.menu { position: fixed; top: var(--header-h); bottom: 0; left: 0; right: 0; z-index: 20; background: #FDFDFB; display: grid; align-content: start; padding: 8px 24px 20px; font-size: calc(13px * var(--fs)); letter-spacing: 0.16em; text-transform: uppercase; transform: translateY(-100%); visibility: hidden; transition: transform 0.3s ease, visibility 0.3s; }
body.menu-open .menu { transform: translateY(0); visibility: visible; }
.menu a { padding: 28px 0; border-bottom: 1px solid #F0EDE7; display: flex; align-items: center; gap: 14px; }
.menu a:last-child { border-bottom: none; }
@media (max-width: 767px) {
  .bar { align-items: center; }
  nav.main, .icons a { display: none; }
  .burger { display: grid; }
}

/* stage: the selected work, as large as the space allows */
/* the work may grow past the page's side padding (out to 3% of the screen) so it is as large as the window allows */
/* view switch (top left, lined up with the logo like the grid gallery's switcher): 1 work, 3 in a row, or 9 in three rows of three; phones are always one-up */
.tools { flex: none; display: flex; justify-content: flex-start; align-items: center; gap: 14px; padding: 14px var(--side-pad) 0; position: relative; z-index: 6; }
/* filter menus (top right, on the bag icon's line, as on the grid gallery): Series and Year */
.filters { margin-left: auto; display: flex; gap: 48px; }
/* 9-up, where the grid needs the room: the two menus stack at the top right, on the bag icon's line (out of the flow, so the toolbar keeps its height) */
.filters.stacked { position: absolute; right: var(--side-pad); top: 14px; flex-direction: column; align-items: flex-end; gap: 10px; }
.filter-menu { position: relative; }
.fm-btn { display: flex; align-items: center; gap: 8px; border: none; background: transparent; padding: 0 0 5px; font-family: inherit; font-size: calc(12px * var(--fs)); letter-spacing: 0.16em; text-transform: uppercase; color: #141414; cursor: pointer; }
.fm-list { position: absolute; top: 100%; right: 0; z-index: 25; width: 240px; margin-top: 6px; background: #FDFDFB; border-top: 1.5px solid #141414; box-shadow: 0 14px 36px rgba(20,20,20,0.12); padding: 14px 0 12px; display: none; }
.filter-menu.open .fm-list { display: grid; }
.fm-list button { text-align: left; border: none; background: transparent; padding: 11px 32px; font-family: inherit; font-size: calc(14px * var(--fs)); font-weight: 300; letter-spacing: 0.08em; color: #141414; cursor: pointer; white-space: nowrap; }
.fm-list button:hover { color: #6E6B66; } .fm-list button.on { color: #8A867E; }
.fm-list .fm-note { padding: 8px 32px 2px; font-size: calc(11px * var(--fs)); letter-spacing: 0.1em; color: #ADA9A2; }
@media (max-width: 767px) { .tools { display: none; } }
.count { border: none; background: transparent; padding: 2px; cursor: pointer; display: flex; color: #C9C5BD; transition: color 0.2s ease; }
.count:hover { color: #6E6B66; } .count.on { color: #141414; }
.count svg { width: 17px; height: 17px; fill: currentColor; display: block; }
/* view icons by screen size (since 2026-10-19): desktop (1280px and wider) 1 / 3 in a row / 3 x 3; small desktop and tablet
   (768-1279px) 1 / 2-column grid; phones show the works as a one-column list instead (no icons) */
.count[data-n="2"] { display: none; }
.page.few .count[data-n="9"] { display: none; }
.count svg.g2, .page.vert .count svg.g3 { display: none; } .page.vert .count svg.g2 { display: block; }   /* (since 2026-10-21) the Vertical filter: the grid icon is 2 x 2 */   /* (since 2026-10-21) a filter leaving 3 works or fewer: no 3 x 3 grid; they show in the 3-up row, centred */
@media (min-width: 768px) and (max-width: 1279px) { .count[data-n="3"], .count[data-n="9"] { display: none; } .count[data-n="2"] { display: flex; } }
/* phones: every work in one scrolling column, full content width, its title under it; a tap opens the detail view */
.list { display: none; }
.page.listmode { height: auto; }
.page.listmode .stage, .page.listmode .caption, .page.listmode .strip-wrap { display: none; }
.page.listmode .list { display: grid; gap: 44px; padding: 28px var(--side-pad) 52px; }
.li { display: grid; justify-items: center; gap: 14px; color: #141414; }
.li img { display: block; width: 100%; height: auto; box-shadow: 0 6px 16px rgba(20,20,20,0.14); }
.li.v img { width: auto; max-width: 100%; max-height: 72vh; }   /* portraits: full width unless that would make them taller than 72% of the screen */
.li span { font-family: 'EB Garamond', serif; font-style: italic; font-size: calc(16px * var(--fs)); letter-spacing: 0.1em; text-transform: uppercase; text-align: center; }
.stage { flex: 1; min-height: 0; position: relative; margin: 10px var(--side-pad) 0; overflow: hidden; }
@media (min-width: 768px) { .stage { margin: 10px max(24px, 3vw) 0; } }
/* the arrows, locked in every view from the first paint: the left chevron's point on the logo's left edge, the right one's on
   the bag icon's right edge (side padding, less the stage's margin, less the point's 1/22 of the chevron's width) */
@media (min-width: 768px) {
  .step.prev { left: calc(var(--side-pad) - max(24px, 3vw) - var(--chev-w) / 22); }
  .step.next { right: calc(var(--side-pad) - max(24px, 3vw) - var(--chev-w) / 22); }
}
/* the featured works sit in a centred row, all the same height, a gap apart */
.row { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 28px; }
.row.grid { display: grid; grid-template-columns: repeat(3, auto); justify-items: center; align-items: center; row-gap: 48px; column-gap: 60px; }   /* 9-up: three columns 60px apart, rows 48px apart, room under each work for its title */
.row.grid .art img { object-fit: contain; }   /* 9-up: every landscape shares one 3:2 box so the columns line up; a scan not exactly 3:2 is fitted inside it, never trimmed */
.art { position: relative; flex: none; display: block; box-shadow: 0 6px 16px rgba(20,20,20,0.14); cursor: pointer; transition: transform 0.9s cubic-bezier(0.25, 0.1, 0.25, 1); }   /* hover growth (since 2026-10-21): slow and soft both ways, 0.9s on a gentle ease, the same coming back */
html:not(.touch) .art:hover { transform: scale(1.03); z-index: 2; }   /* hover: a subtle centre-out enlargement */
.art img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 0.9s ease-in-out; -webkit-user-drag: none; user-select: none; }
.stage { touch-action: pan-y; }
.art img.on { opacity: 1; }
/* previous / next chevrons either side of the work (placed by fit()) */
.step { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; transition: left 0.95s cubic-bezier(0.6, 0, 0.2, 1), right 0.95s cubic-bezier(0.6, 0, 0.2, 1); width: var(--step-w); height: 150px; padding: 0; border: none; background: transparent; color: #ADA9A2; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color 0.2s ease; }
.step:hover { color: #6E6B66; }
.step.prev { justify-content: flex-start; } .step.next { justify-content: flex-end; }
:root { --chev-w: clamp(9.75px, 1.31625vw, 19.0125px); }
@media (min-width: 2001px) { :root { --chev-w: 28.52px; } }   /* screens over 2000px: the chevrons 150% of that (since 2026-10-21): 28.5 x 78px */
.step svg { width: var(--chev-w); height: auto; }   /* 65% of the earlier size since 2026-10-19 (49% of the original): 19 x 53px on a 1440px screen, scaling down with the viewport to 9.75 x 27px */
.caption { flex: none; height: clamp(34px, calc(2.38vw + 10.2px), 57.8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: 'EB Garamond', serif; font-size: calc(clamp(16px, calc(1.12vw + 4.8px), 27.2px) * var(--fs) * 0.85); font-style: italic; letter-spacing: 0.1em; text-transform: uppercase; color: #141414; opacity: 0; transition: opacity 0.35s ease; }
.caption small { font-family: "Neuzeit Grotesk", "Helvetica Neue", Helvetica, sans-serif; font-style: normal; font-size: calc(10px * var(--fs)); letter-spacing: 0.2em; text-transform: uppercase; color: #ADA9A2; }
.page.hovering .caption { opacity: 1; }
.page.multi .caption { transition: opacity 0.25s ease; }   /* 3 and 9 views (since 2026-10-21): the title fades in and out too (it used to pop) */
/* one-up on screens 1760-3300px wide: the hover title 3px larger */
@media (min-width: 1760px) and (max-width: 3300px) { .page:not(.multi) .caption { font-size: calc(calc(clamp(16px, calc(1.12vw + 4.8px), 27.2px) + 3px) * var(--fs) * 0.85); } }   /* 3 and 9 views: the title never slides between works; it fades out, moves under the work the cursor is on, and fades in */
html.touch .caption { opacity: 1; }
/* touch screens: title and arrows are hidden while anything moves (slides, crossfades, swipes, the strip, page scrolling) */
html.touch .page.moving .caption, html.touch .page.moving .step { opacity: 0; transition: opacity 0.15s ease; }

/* filmstrip: every work in one row, anchored above the footer. The row is a track moved by transform (fluid,
   eased) and thumbnails magnify under the cursor or finger; the wrap's top padding is headroom for them. */
.strip-wrap { flex: none; position: relative; z-index: 5; margin-top: -120px; padding: 120px 0 29px; pointer-events: none;   /* 29px under the strip: 15px higher since 2026-10-21 */
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--side-pad), #000 calc(100% - var(--side-pad)), transparent);
          mask-image: linear-gradient(90deg, transparent, #000 var(--side-pad), #000 calc(100% - var(--side-pad)), transparent); }
.strip { overflow: visible; padding: 6px 0; display: flex; justify-content: safe center; }   /* (since 2026-10-20) a strip shorter than the page is centred on it */
.track { display: flex; gap: 6px; align-items: flex-end; width: max-content; padding: 0 var(--side-pad); will-change: transform; pointer-events: auto; }
.thumb { flex: none; height: var(--thumb-h); padding: 0; border: none; background: none; cursor: pointer; position: relative; transform-origin: center bottom; transition: transform 0.45s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 0.3s ease;   /* the swell follows the cursor softly (0.45s since 2026-10-21; was 0.16s) */ }
.thumb img { display: block; height: var(--thumb-h); width: auto; box-shadow: 0 2px 8px rgba(20,20,20,0.12); transition: box-shadow 0.35s ease; }
.thumb.on img { box-shadow: 0 4px 12px rgba(20,20,20,0.38); }   /* the works featured in the main area: a deeper shadow */
html.touch .track { touch-action: none; }

/* footer */
footer { flex: none; height: var(--footer-h); box-sizing: border-box; border-top: 1px solid #E7E4DE; background: #FAF9F5; position: relative; z-index: 25; }
.foot { height: 100%; box-sizing: border-box; padding: 0 var(--side-pad); display: flex; align-items: center; justify-content: space-between; gap: 24px; font-size: calc(12px * var(--fs)); color: #0F0F0F; }
.foot p { margin: 0; }
.social { display: flex; gap: 16px; align-items: center; }
.social a { display: flex; opacity: 0.85; } .social a:hover { opacity: 1; }
.social img { display: block; width: 27.5px; height: 27.5px; }
/* TEMP: while G5 / G6 / G7 are in the nav, tighten it at tablet widths so the header stays on one line */
@media (min-width: 768px) and (max-width: 1919px) { header nav { gap: 16px !important; font-size: calc(12px * var(--fs)) !important; letter-spacing: 0.08em !important; } }
@media (min-width: 768px) and (max-width: 899px) { header nav { gap: 9px !important; font-size: calc(11px * var(--fs)) !important; letter-spacing: 0.03em !important; } }
</style>

function buildSlots(n) {
  row.innerHTML = ''; slots.length = 0; row.classList.toggle('grid', isGrid()); page.classList.toggle('multi', count > 1);

  const R = s => grid && WORKS[s.idx].r >= 1 ? 1.5 : WORKS[s.idx].r;

    const bottom = st.top + H / 2 - lift + h / 2, hP = bottom - iconTop;

  }

  slots.forEach(s => { s.a.style.width = h3 * R(s) + 'px'; s.a.style.height = h3 + 'px'; });

let fSeries = 'All', fYear = 'All', gridWas = false;
const SERIES_OPTS = [['All', 'All Series'], ['Ascent'], ['Convergence'], ['Core'], ['Select'],   // (Outliers left out of the menu since 2026-10-21; its works still show under All Series)
  ['Spectrum'], ['Structure'], ['The Turning'], ['Tonal'], ['Horizontal'], ['Vertical']];
function yearOpts() { return [['All', 'All Years']].concat([...new Set(ALL.map(w => w.y).filter(Boolean))].sort((a, b) => b - a).map(y => [String(y)])); }
function applyFilter() {
  const list = ALL.filter(w => (fSeries === 'All' || w.s === fSeries || (fSeries === 'Horizontal' && w.r >= 1) || (fSeries === 'Vertical' && w.r < 1)) && (fYear === 'All' || String(w.y) === fYear));
  if (!list.length) return;
  WORKS.length = 0; WORKS.push(...list);
  // (since 2026-10-21) 3 works or fewer: the 3 x 3 icon goes and a desktop grid becomes the 3-up row (back to the grid once the
  // filter shows more again, if it was the grid that was left)
  const few = list.length <= 3; page.classList.toggle('few', few);
  page.classList.toggle('vert', fSeries === 'Vertical'); document.querySelector('.count[data-n="9"]').setAttribute('aria-label', fSeries === 'Vertical' ? '4 works at a time' : '9 works at a time');
  if (!tab.matches && !phone.matches) {
    if (few && view === 9) { view = deskView = 3; gridWas = true; } else if (!few && gridWas) { view = deskView = 9; gridWas = false; }
    [...document.querySelectorAll('.count')].forEach(b => b.classList.toggle('on', +b.dataset.n === view));
  }
  buildStrip(); pos = target = vel = 0; track.style.transform = 'translate3d(0px,0,0)';
  first = current = 0; count = viewCount(); buildPages(); buildSlots(Math.min(count, WORKS.length)); setWindow(0, false);
  if (phone.matches) buildList();
}
const menuRenders = [];
function menu(id, label, opts, get, set) {
  const m = $(id), btn = m.querySelector('.fm-btn'), list = m.querySelector('.fm-list');
  const render = () => {
    btn.querySelector('span').textContent = get() === 'All' ? label : get();
    list.innerHTML = '';
    opts().forEach(([v, l]) => { const o = document.createElement('button'); o.setAttribute('role', 'option'); o.textContent = l || v; o.classList.toggle('on', get() === v); o.setAttribute('aria-selected', get() === v);
      o.addEventListener('click', e => { e.stopPropagation(); set(v); close(); menuRenders.forEach(r => r()); applyFilter(); }); list.appendChild(o); });
    if (id === 'fmYear' && opts().length === 1) { const n = document.createElement('p'); n.className = 'fm-note'; n.style.margin = '0'; n.textContent = 'Years to be added'; list.appendChild(n); }
  };
  btn.addEventListener('click', e => { e.stopPropagation(); const open = !m.classList.contains('open'); close(); m.classList.toggle('open', open); btn.setAttribute('aria-expanded', open); });
  render(); menuRenders.push(render);
}
function close() { document.querySelectorAll('.filter-menu.open').forEach(x => { x.classList.remove('open'); x.querySelector('.fm-btn').setAttribute('aria-expanded', 'false'); }); }
// one filter at a time (since 2026-10-21): choosing a series sets the Year menu back to "Year" (all years), and choosing a year
// sets the Series menu back to "Series" (all series)
menu('fmSeries', 'Series', () => SERIES_OPTS, () => fSeries, v => { fSeries = v; if (v !== 'All') fYear = 'All'; });
menu('fmYear', 'Year', yearOpts, () => fYear, v => { fYear = v; if (v !== 'All') fSeries = 'All'; });
document.addEventListener('click', e => { if (!e.target.closest('.filter-menu')) close(); });
addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

// start on the work named in the URL, else the first work
const want = decodeURIComponent(location.hash.slice(1));
const start = WORKS.findIndex(w => w.f === want || w.t === want);
[...document.querySelectorAll('.count')].forEach(b => b.classList.toggle('on', +b.dataset.n === view));
buildPages();
buildSlots(Math.min(count, WORKS.length));
setWindow(start >= 0 ? start : 0, start > 0);
stripReady = true;
if (phone.matches) { page.classList.add('listmode'); buildList(); if (start > 0) { const el = document.getElementById('li-' + WORKS[start].f); if (el) el.scrollIntoView({ block: 'start' }); } }   // phones: the list, opened at the work named in the URL
</script>
</body>
</html>
