<style>
/* Shared site tokens: header/footer heights and side padding match the other pages */
:root { --header-h: clamp(72px, 57px + 1.172vw, 80px); --footer-h: clamp(43px, 19px + 1.859vw, 54px); --side-pad: 24px; --thumb-h: 31px; --step-w: 32px; }

@media (min-width: 768px) { :root { --side-pad: 48px; } }
@media (min-width: 1024px) { :root { --side-pad: 10vw; } }
html, body { height: 100%; margin: 0; }
body { background: #FDFDFB; color: #141414; font-family: "Neuzeit Grotesk", "Helvetica Neue", Helvetica, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: #141414; text-decoration: none; }
a:hover { color: #6E6B66; }
button { font-family: inherit; }
::selection { background: #E9E6DF; }

/* header + work + thumbnails fill the screen exactly; the footer sits below the fold and is reached by scrolling */
.page { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
/* Phones in portrait: footer twice as tall and kept on screen (header, work and filmstrip share the rest of the height) */
@media (max-width: 767px) and (orientation: portrait) { :root { --footer-h: 86px; } .page { height: calc(100vh - var(--footer-h)); height: calc(100dvh - var(--footer-h)); } }

/* header */
header { flex: none; border-bottom: 1px solid #E7E4DE; background: #FDFDFB; position: relative; z-index: 30; }
.bar { height: var(--header-h); box-sizing: border-box; padding: 0 var(--side-pad); display: flex; flex-wrap: wrap; align-content: center; align-items: baseline; justify-content: space-between; gap: 32px; }
.logo { position: relative; display: block; width: 188.2px; overflow: hidden; font-family: 'EB Garamond', serif; font-size: 29px; letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap; }
.logo .logo-text { visibility: hidden; }
.logo .logo-text span { font-style: italic; text-transform: none; letter-spacing: 0; }
.right, .icons { display: flex; align-items: baseline; }
.right { gap: 40px; } .icons { gap: 20px; }
nav.main { display: flex; gap: 40px; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; }
nav.main .on { font-weight: 600; }
.icons a { display: flex; position: relative; }
.badge { position: absolute; top: -6px; right: -8px; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #141414; color: #FDFDFB; font-size: 9px; }
.burger { display: none; border: none; background: transparent; padding: 8px 0 8px 8px; cursor: pointer; gap: 5px; }
.burger span { display: block; width: 20px; height: 1.5px; background: #141414; transition: transform 0.2s, opacity 0.2s; }
body.menu-open .burger span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
body.menu-open .burger span:nth-child(2) { opacity: 0; }
body.menu-open .burger span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
.menu { position: fixed; top: var(--header-h); bottom: 0; left: 0; right: 0; z-index: 20; background: #FDFDFB; display: grid; align-content: start; padding: 8px 24px 20px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; transform: translateY(-100%); visibility: hidden; transition: transform 0.3s ease, visibility 0.3s; }
body.menu-open .menu { transform: translateY(0); visibility: visible; }
.menu a { padding: 28px 0; border-bottom: 1px solid #F0EDE7; display: flex; align-items: center; gap: 14px; }
.menu a:last-child { border-bottom: none; }
@media (max-width: 767px) {
  .bar { align-items: center; }
  nav.main, .icons a { display: none; }
  .burger { display: grid; }
}

/* stage: the selected work, as large as the space allows */
/* the work may grow past the page's side padding (out to 3% of the screen) so it is as large as the window allows */
/* count switch (top right of the content area): how many works show side by side; phones are always one-up */
.tools { flex: none; display: flex; justify-content: flex-end; gap: 14px; padding: 14px var(--side-pad) 0; }
@media (min-width: 768px) { .tools { padding: 14px max(24px, 3vw) 0; } }
@media (max-width: 767px) { .tools { display: none; } }
.count { border: none; background: transparent; padding: 2px; cursor: pointer; display: flex; color: #C9C5BD; transition: color 0.2s ease; }
.count:hover { color: #6E6B66; } .count.on { color: #141414; }
.count svg { width: 17px; height: 17px; fill: currentColor; display: block; }
.stage { flex: 1; min-height: 0; position: relative; margin: 10px var(--side-pad) 0; overflow: hidden; }
@media (min-width: 768px) { .stage { margin: 10px max(24px, 3vw) 0; } }
/* the featured works sit in a centred row, all the same height, a gap apart */
.row { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 28px; }
.art { position: relative; flex: none; display: block; box-shadow: 0 6px 16px rgba(20,20,20,0.14); cursor: pointer; }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 0.9s ease-in-out; }
.art img.on { opacity: 1; }
/* previous / next chevrons either side of the work (placed by fit()) */
.step { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; transition: left 0.65s cubic-bezier(0.45, 0, 0.15, 1), right 0.65s cubic-bezier(0.45, 0, 0.15, 1); width: var(--step-w); height: 150px; padding: 0; border: none; background: transparent; color: #ADA9A2; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color 0.2s ease; }
.step:hover { color: #6E6B66; }
.step.prev { justify-content: flex-start; } .step.next { justify-content: flex-end; }
.step svg { width: 39px; height: 108px; }
@media (max-width: 767px) { .step svg { width: 20px; height: 56px; } }
.caption { flex: none; height: 34px; display: flex; align-items: center; justify-content: center; gap: 14px; font-family: 'EB Garamond', serif; font-size: 16px; font-style: italic; letter-spacing: 0.1em; text-transform: uppercase; color: #141414; opacity: 0; transition: opacity 0.35s ease, transform 0.25s ease; }
.caption small { font-family: "Neuzeit Grotesk", "Helvetica Neue", Helvetica, sans-serif; font-style: normal; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #ADA9A2; }
.page.hovering .caption { opacity: 1; }
html.touch .caption { opacity: 1; }

/* filmstrip: every work in one row, anchored above the footer. The row is a track moved by transform (fluid,
   eased) and thumbnails magnify under the cursor or finger; the wrap's top padding is headroom for them. */
.strip-wrap { flex: none; position: relative; z-index: 5; margin-top: -120px; padding: 120px 0 14px; pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--side-pad), #000 calc(100% - var(--side-pad)), transparent);
          mask-image: linear-gradient(90deg, transparent, #000 var(--side-pad), #000 calc(100% - var(--side-pad)), transparent); }
.strip { overflow: visible; padding: 6px 0; }
.track { display: flex; gap: 6px; align-items: flex-end; width: max-content; padding: 0 var(--side-pad); will-change: transform; pointer-events: auto; }
.thumb { flex: none; height: var(--thumb-h); padding: 0; border: none; background: none; cursor: pointer; opacity: 0.55; outline: 1.5px solid transparent; outline-offset: 0; position: relative; transform-origin: center bottom; transition: transform 0.16s ease-out, opacity 0.3s ease, outline-color 0.3s ease; }
.thumb img { display: block; height: var(--thumb-h); width: auto; box-shadow: 0 2px 8px rgba(20,20,20,0.12); }
.thumb.on { opacity: 1; outline-color: #141414; }
html.touch .track { touch-action: none; }

/* footer */
footer { flex: none; height: var(--footer-h); box-sizing: border-box; border-top: 1px solid #E7E4DE; background: #FAF9F5; position: relative; z-index: 25; }
.foot { height: 100%; box-sizing: border-box; padding: 0 var(--side-pad); display: flex; align-items: center; justify-content: space-between; gap: 24px; font-size: 12px; color: #0F0F0F; }

.social { display: flex; gap: 16px; align-items: center; }
.social a { display: flex; opacity: 0.85; } .social a:hover { opacity: 1; }
.social img { display: block; width: 27.5px; height: 27.5px; }

document.documentElement.classList.toggle('touch', !matchMedia('(hover: hover) and (pointer: fine)').matches);
// A window of `count` works starting at `first` is featured in the row; each slot crossfades between two images.
const phone = matchMedia('(max-width: 767px)');
let count = phone.matches ? 1 : 2, deskCount = 2, first = 0, current = 0;
const slots = [];
function buildSlots(n) {
  row.innerHTML = ''; slots.length = 0;
  for (let i = 0; i < n; i++) {
    const a = document.createElement('a'); a.className = 'art'; a.href = '#'; a.setAttribute('aria-label', 'View work details');
    const imgs = [document.createElement('img'), document.createElement('img')]; imgs.forEach(im => { im.alt = ''; a.appendChild(im); });
    const slot = { a, imgs, front: 0, idx: -1, turns: 0 };
    a.addEventListener('mouseenter', () => { $('capTitle').textContent = WORKS[slot.idx].t; capDx = a.getBoundingClientRect().left + a.offsetWidth / 2 - (stage.getBoundingClientRect().left + stage.clientWidth / 2); placeCaption(); page.classList.add('hovering'); });
    a.addEventListener('mouseleave', () => page.classList.remove('hovering'));
    row.appendChild(a); slots.push(slot);
  }
}

// size the row: every featured work the same height, as large as the stage allows, chevrons hugging the row
function fit() {
  if (!slots.length || slots.some(s => s.idx < 0)) return;
  const step = $('prev').offsetWidth, gap = count > 1 ? 28 : 0;
  const W = stage.clientWidth - 2 * step - gap * (count - 1), H = stage.clientHeight;
  const sumR = slots.reduce((t, s) => t + WORKS[s.idx].r, 0);
  const h = Math.min(H, W / sumR);
  let total = gap * (count - 1);
  slots.forEach(s => { const w = h * WORKS[s.idx].r; s.a.style.width = w + 'px'; s.a.style.height = h + 'px'; total += w; });
  $('prev').style.left = $('next').style.right = ((stage.clientWidth - total) / 2 - step) + 'px';
  // sit the hover title midway between the bottom of the row and the top of the thumbnails, under the hovered work
  const sb = stage.getBoundingClientRect().bottom, rowBottom = sb - (H - h) / 2;
  capDy = (rowBottom + track.getBoundingClientRect().top) / 2 - (sb + caption.offsetHeight / 2);
  placeCaption();
}
let capDx = 0, capDy = 0;
function placeCaption() { caption.style.transform = 'translate(' + capDx.toFixed(1) + 'px, ' + capDy.toFixed(1) + 'px)'; }

// put work k in a slot with a soft crossfade (incoming image decoded first; only the latest request lands)
function assign(slot, k) {
  if (slot.idx === k) return;
  slot.idx = k;
  const w = WORKS[k], next = slot.imgs[1 - slot.front], prev = slot.imgs[slot.front], turn = ++slot.turns;
  const swap = () => { if (turn !== slot.turns) return; fit(); next.classList.add('on'); prev.classList.remove('on'); slot.front = 1 - slot.front; };
  next.alt = w.t;
  next.src = 'assets/works/' + w.f;
  Promise.race([next.decode ? next.decode() : Promise.resolve(), new Promise(r => setTimeout(r, 800))]).then(swap, swap);   // decode first, but never wait more than 0.8s (hidden tabs defer decoding)
  slot.a.href = 'Gallery.dc.html#' + encodeURIComponent(w.f);   // detail view, matched by file so "Untitled" works resolve correctly
}

// slide the row: the current works glide out one way while the new set glides in from the other, moving together
// like a belt. d = +1 for the right arrow (the works travel to the right, the new set arriving from the left),
// -1 for the left arrow; the incoming images are decoded before anything moves
let outRow = null;
async function slideTo(ks, d) {
  if (outRow) { outRow.remove(); outRow = null; row.style.transition = 'none'; row.style.transform = ''; }
  const outW = row.getBoundingClientRect().width;
  const out = row.cloneNode(true); out.id = ''; out.style.transition = 'none'; out.style.transform = ''; stage.appendChild(out); outRow = out;
  await Promise.all(ks.map(k => { const im = new Image(); im.src = 'assets/works/' + WORKS[k].f; return Promise.race([im.decode ? im.decode().catch(() => {}) : Promise.resolve(), new Promise(r => setTimeout(r, 800))]); }));
  if (outRow !== out) return;   // superseded by a later move
  slots.forEach((s, i) => {
    const k = ks[i], w = WORKS[k], im = s.imgs[s.front]; s.idx = k; s.turns++;
    im.src = 'assets/works/' + w.f; im.alt = w.t; im.classList.add('on'); s.imgs[1 - s.front].classList.remove('on');
    s.a.href = 'Gallery.dc.html#' + encodeURIComponent(w.f);
  });
  fit();
  const dist = outW / 2 + 28 + row.getBoundingClientRect().width / 2;
  row.style.transition = 'none'; row.style.transform = 'translate(-50%, -50%) translateX(' + (-d * dist) + 'px)';
  void row.offsetWidth;
  const ease = 'transform 0.65s cubic-bezier(0.45, 0, 0.15, 1)';
  row.style.transition = ease; out.style.transition = ease;
  row.style.transform = 'translate(-50%, -50%)'; out.style.transform = 'translate(-50%, -50%) translateX(' + (d * dist) + 'px)';
  setTimeout(() => { if (outRow === out) { out.remove(); outRow = null; row.style.transition = ''; } }, 700);
}

// feature the works from f onward (the window never runs past the end of the list); moving the window slides the row,
// changing the count (same first work) crossfades the slots in place
function setWindow(f, scrollIntoView, dir) {
  f = Math.max(0, Math.min(WORKS.length - count, f));
  const ks = slots.map((s, i) => f + i);
  const moving = slots[0].idx >= 0 && f !== first;
  first = current = f;
  if (moving) slideTo(ks, dir || (f > slots[0].idx ? 1 : -1)); else slots.forEach((s, i) => assign(s, ks[i]));
  [...track.children].forEach((b, i) => { const on = i >= f && i < f + count; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  $('capTitle').textContent = WORKS[f].t; capDx = 0; placeCaption();
  if (scrollIntoView) centreOn(track.children[f + Math.floor((count - 1) / 2)]);
  [f - 1, f + count].forEach(n => { if (n >= 0 && n < WORKS.length) new Image().src = 'assets/works/' + WORKS[n].f; });   // neighbours ready for the arrows
  history.replaceState(null, '', '#' + encodeURIComponent(WORKS[f].f));
}
// arrows, keys and swipes move by a whole window (one-up wraps round at the ends; wider windows stop at them)
function stepBy(d) { setWindow(count === 1 ? (first + d + WORKS.length) % WORKS.length : first + d * count, true, d); }
// change how many works show at once, keeping the current first work ("extend from current")
function setCount(n) {
  count = n;
  if (!phone.matches) deskCount = n;
  [...document.querySelectorAll('.count')].forEach(b => b.classList.toggle('on', +b.dataset.n === n));
  buildSlots(n);
  setWindow(first, false);
}
[...document.querySelectorAll('.count')].forEach(b => b.addEventListener('click', () => setCount(+b.dataset.n)));
phone.addEventListener('change', () => setCount(phone.matches ? 1 : deskCount));
function show(k, scrollIntoView) { setWindow(k, scrollIntoView); }   // thumbnail click: the window slides to that work

// build the strip
WORKS.forEach((w, k) => {
  const b = document.createElement('button');
  b.className = 'thumb'; b.setAttribute('role', 'option'); b.setAttribute('aria-label', w.t); b.title = w.t;
  const im = document.createElement('img');
  im.src = 'assets/thumbs/' + w.f; im.alt = ''; im.loading = 'lazy';
  b.appendChild(im);
  b.addEventListener('click', () => show(k, false));
  track.appendChild(b);
});

// ---- Filmstrip motion (mouse devices)
// The row is a track moved with translate3d. The mouse position across the screen sets where the row should be
// (left edge = start, right edge = end) and the track eases toward it every frame, so it glides rather than steps.
let pos = 0, target = 0, vel = 0, cap = 0, drive = null, running = false, mouseX = null;
// The cursor (or finger) steers the row: in the middle DEAD share of the page it eases to a stop, and the further
// left or right of that the faster it drifts that way, up to CRUISE at the page edges.
// GLIDE: ms to close ~63% of the gap when settling on a chosen thumbnail; CRUISE: top speed (px per second);
// ACCEL: ms for the row to pick up / shed speed (keep under GLIDE / 4 so it never overshoots)
const GLIDE = 1200, CRUISE = 380, ACCEL = 260, DEAD = 0.10;
const maxPan = () => Math.max(0, track.scrollWidth - strip.clientWidth);
function run() {
  if (running) return; running = true;
  let last = performance.now();
  const step = now => {
    // time-based so the speed is the same on 60Hz and 120Hz screens: the row eases up to a capped cruising
    // speed, drifts, then eases to rest
    const dt = Math.min(64, now - last); last = now;
    const d = target - pos;
    if (drive !== null) {   // steering: ease toward the speed the cursor asks for, stopping at either end
      vel += (drive - vel) * (1 - Math.exp(-dt / ACCEL));
      pos = Math.max(0, Math.min(maxPan(), pos + vel * dt));
      if ((pos === 0 && vel < 0) || (pos === maxPan() && vel > 0) || (drive === 0 && Math.abs(vel) < 0.002)) vel = 0;
      target = pos;
    }
    else if (cap === Infinity) { vel = 0; pos = Math.abs(d) < 0.3 ? target : pos + d * (1 - Math.exp(-dt / 160)); }   // wheel / trackpad: follow directly
    else {
      const want = Math.max(-cap, Math.min(cap, d / GLIDE));   // px per ms
      vel += (want - vel) * (1 - Math.exp(-dt / ACCEL));
      if (Math.abs(d) < 0.3 && Math.abs(vel) < 0.01) { pos = target; vel = 0; } else pos += vel * dt;
    }
    track.style.transform = 'translate3d(' + (-pos).toFixed(2) + 'px,0,0)';
    if (mouseX !== null) magnify(mouseX);
    if (pos !== target || mouseX !== null) requestAnimationFrame(step); else running = false;
  };
  requestAnimationFrame(step);
}
function centreOn(b) {
  target = Math.max(0, Math.min(maxPan(), b.offsetLeft + b.offsetWidth / 2 - strip.clientWidth / 2));
  cap = CRUISE / 1000; drive = null;
  run();
}

// Dock-style magnification: thumbnails swell under the cursor (bell curve), growing up from the baseline;
// neighbours slide aside, and the thumbnail under the cursor stays under it.
const PEAK = 0.9;              // +90% at the cursor
function magnify(x) {
  const left = strip.getBoundingClientRect().left - pos;   // screen x of the track's origin
  const btns = [...track.children];
  const geo = btns.map(b => ({ l: left + b.offsetLeft, w: b.offsetWidth }));
  const sigma = 1.7 * (geo[0].w + 6);
  const bell = geo.map(g => Math.exp(-Math.pow((x - (g.l + g.w / 2)) / sigma, 2)));
  const extra = geo.map((g, k) => PEAK * bell[k] * g.w);
  let cursorExtra = 0;          // growth that sits to the left of the cursor
  geo.forEach((g, k) => { cursorExtra += extra[k] * Math.max(0, Math.min(1, (x - g.l) / g.w)); });
  let acc = 0;
  btns.forEach((b, k) => {
    const shift = acc + extra[k] / 2 - cursorExtra; acc += extra[k];
    b.style.transform = bell[k] < 0.002 && Math.abs(shift) < 0.5 ? '' : 'translateX(' + shift.toFixed(1) + 'px) scale(' + (1 + PEAK * bell[k]).toFixed(3) + ')';
    b.style.opacity = b.classList.contains('on') ? '' : (0.55 + 0.45 * bell[k]).toFixed(2);
    b.style.zIndex = Math.round(bell[k] * 100);
  });
}
function relax() {
  mouseX = null; drive = null;
  if (cap !== Infinity) target = Math.max(0, Math.min(maxPan(), pos + vel * GLIDE * 0.5));   // coast to a stop rather than drifting on to the old target
  [...track.children].forEach(b => { b.style.transition = 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease, outline-color 0.3s ease'; b.style.transform = ''; b.style.opacity = ''; b.style.zIndex = ''; });
  setTimeout(() => [...track.children].forEach(b => { b.style.transition = ''; }), 520);
}
// the row only moves while the pointer is on the thumbnails: the row itself, or a magnified thumbnail rising above it
const inBand = (y, el) => { const band = track.getBoundingClientRect(); return (y >= band.top - 4 && y <= band.bottom + 4) || !!(el && el.closest && el.closest('.thumb')); };
function follow(x) {
  mouseX = x;
  const half = innerWidth / 2, dead = innerWidth * DEAD / 2, off = x - half;
  drive = Math.abs(off) <= dead ? 0 : Math.sign(off) * Math.min(1, (Math.abs(off) - dead) / (half - dead - Math.min(120, innerWidth * 0.08))) * CRUISE / 1000;
  cap = CRUISE / 1000;
  run();
}
function halt() { relax(); target = pos; vel = 0; }
// finger: the row glides and magnifies only while a finger is on the filmstrip, coasts to rest when it lifts,
// and a touch anywhere else on the page stops it dead
addEventListener('touchstart', e => {
  lastTouch = Date.now();
  document.documentElement.classList.add('touch');
  const t = e.touches[0];
  touching = inBand(t.clientY, e.target);
  if (touching) follow(t.clientX); else halt();
}, { passive: true, capture: true });
addEventListener('touchmove', e => { lastTouch = Date.now(); if (touching) follow(e.touches[0].clientX); }, { passive: true });
['touchend', 'touchcancel'].forEach(n => addEventListener(n, () => { lastTouch = Date.now(); if (touching) { touching = false; relax(); } }, { passive: true }));
{
  addEventListener('mousemove', e => {
    if (Date.now() - lastTouch < 1200) return;   // mouse events synthesised from a tap
    document.documentElement.classList.remove('touch');
    if (!inBand(e.clientY, e.target)) { if (mouseX !== null) relax(); return; }
    follow(e.clientX);
  });
  document.addEventListener('mouseleave', () => { if (mouseX !== null) relax(); });
  strip.addEventListener('wheel', e => { e.preventDefault(); target = Math.max(0, Math.min(maxPan(), target + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY))); cap = Infinity; drive = null; run(); }, { passive: false });
}

// keyboard, resize
addEventListener('keydown', e => { if (e.key === 'ArrowRight') stepBy(1); if (e.key === 'ArrowLeft') stepBy(-1); });
addEventListener('resize', fit);
new ResizeObserver(fit).observe(stage);

$('prev').addEventListener('click', () => stepBy(-1));
$('next').addEventListener('click', () => stepBy(1));

// swipe the main image on touch screens
let tx = 0;
stage.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
stage.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) stepBy(dx < 0 ? 1 : -1); });

// mobile menu
$('burger').addEventListener('click', () => document.body.classList.toggle('menu-open'));

// start on the work named in the URL, else the first work
const want = decodeURIComponent(location.hash.slice(1));
const start = WORKS.findIndex(w => w.f === want || w.t === want);
[...document.querySelectorAll('.count')].forEach(b => b.classList.toggle('on', +b.dataset.n === count));
buildSlots(count);
setWindow(start >= 0 ? start : 0, start > 0);
</script>
</body>
</html>
